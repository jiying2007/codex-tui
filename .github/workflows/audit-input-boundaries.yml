name: audit-input-boundaries
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-input-boundaries.yml'
      - 'tests/unicode_snooze.rs'
permissions:
  contents: write
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/v1.4-unicode-snooze'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Reproduce Unicode reducer panics and apply checked slicing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit"
          python3 - <<'PY'
          import os,pathlib,re,subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP'],'audit')
          p = subprocess.run(['cargo','test','--locked','--test','unicode_snooze','--','--test-threads=1'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
          (out/'before.log').write_text(p.stdout)
          failures = set(re.findall(r'^test (\w+) \.\.\. FAILED$',p.stdout,re.M))
          expected = {'invalid_unicode_snooze_is_rejected_without_losing_editor_or_state','invalid_unicode_batch_snooze_is_rejected_without_a_write_plan'}
          print(p.stdout[-9000:])
          if p.returncode == 0 or failures != expected or 'not a char boundary' not in p.stdout:
              raise SystemExit('expected exactly two UTF-8 boundary behavioral panics')
          path = pathlib.Path('src/app.rs')
          text = path.read_text()
          old = '    let (number, suffix) = value.split_at(value.len() - 1);'
          if text.count(old) != 1:
              raise SystemExit('duration parser changed')
          path.write_text(text.replace(old,'    let (number, suffix) = value.split_at_checked(value.len() - 1)?;',1))
          PY
          cargo fmt --all
          cargo clippy --locked --all-targets --all-features -- -D warnings > "$RUNNER_TEMP/audit/clippy.log" 2>&1
          cargo test --locked --all-targets --all-features > "$RUNNER_TEMP/audit/after.log" 2>&1
          python3 -m unittest discover -s scripts/release -p 'test_*.py' > "$RUNNER_TEMP/audit/python.log" 2>&1
          python3 scripts/architecture/check_module_ratchet.py release/v1.3-plan.json
          python3 scripts/architecture/check_module_ratchet.py release/v1.4-plan.json
          python3 scripts/release/validate_v1_4_plan.py
          python3 scripts/release/validate_v1_4_completion.py
          git diff --check
      - name: Retain bounded audit inventory and exact tested blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'],'audit')
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          if git('rev-parse','HEAD') != os.environ['EXPECTED_HEAD']: raise SystemExit('head changed')
          survey=[]
          for path in sorted(pathlib.Path('src').rglob('*.rs')):
              text=path.read_text()
              for n,line in enumerate(text.splitlines(),1):
                  if any(token in line for token in ['split_at(', '.truncate(', 'ForgeReviewLoaded', 'ForgeEvent::Review', 'load_review(', 'GitHandle {', 'ForgeHandle {']):
                      survey.append(f'{path}:{n}: {line.strip()}')
          (out/'survey.txt').write_text('\n'.join(survey)+'\n')
          print('AUDIT_SURVEY\n'+'\n'.join(survey))
          paths=git('diff','--name-only').splitlines()
          if not set(paths).issubset({'src/app.rs','tests/unicode_snooze.rs'}) or 'src/app.rs' not in paths: raise SystemExit('unexpected patch scope')
          entries=[]
          for name in paths:
              body={'encoding':'utf-8','content':pathlib.Path(name).read_text()}
              p=subprocess.run(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs','--input','-'],input=json.dumps(body),capture_output=True,text=True,check=True)
              sha=json.loads(p.stdout)['sha']
              if sha != git('hash-object',name): raise SystemExit('blob mismatch')
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          pathlib.Path('.github/workflows/audit-input-boundaries.yml').unlink()
          git('add','-A')
          receipt={'parent':os.environ['EXPECTED_HEAD'],'tree':git('write-tree'),'entries':entries,'refUpdated':False,'localExecution':False}
          (out/'candidate.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('VERIFIED_CANDIDATE='+json.dumps(receipt))
          print('TEST_SUMMARY\n'+'\n'.join(x for x in (out/'after.log').read_text().splitlines() if 'test result:' in x))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unicode-input-audit
          path: ${{ runner.temp }}/audit/
          if-no-files-found: error
          retention-days: 30
