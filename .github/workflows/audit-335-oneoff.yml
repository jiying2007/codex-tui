name: audit-335-oneoff

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [.github/workflows/audit-335-oneoff.yml]

permissions:
  contents: read

jobs:
  repair:
    if: >-
      github.repository == 'jiying2007/codex-tui' &&
      github.event.pull_request.number == 337 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/conversation-watch-ownership-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Apply exact reviewed source replacements on the feature branch only
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          base = 'e500f9be97429c9207553216354850829c5b95e6'
          assert git('rev-parse', 'HEAD') == os.environ['EXPECTED_HEAD']
          assert git('rev-parse', 'HEAD^') == base
          assert git('diff', '--name-only', base, 'HEAD') == '.github/workflows/audit-335-oneoff.yml'
          expected = {
              'src/app/reducer.rs': '992737750999fea2709784f51b18c7ea949543eb',
              'src/app/tests.rs': '72abda271939d0259f0fdafe1190c0a9dee06aec',
              'release/v1.4-plan.json': 'db5a1f5e22c9115c3dde032e9df1b1927f245b85',
          }
          for path, blob in expected.items():
              assert git('rev-parse', 'HEAD:' + path) == blob, path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              assert text.count(old) == 1, (path, old)
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('src/app/reducer.rs',
              '    effects.retain(|effect| {\n        !matches!(effect, Effect::StopWatchingConversation(id) if owners.contains(&id.0))\n    });',
              '    effects.retain(\n        |effect| !matches!(effect, Effect::StopWatchingConversation(id) if owners.contains(&id.0)),\n    );')
          prefix = ('fn opening_and_backing_out_preserves_registry_selection() {\n'
                    '    let mut app = app();\n'
                    '    reduce(&mut app, Action::MoveSelection(1));\n'
                    '    let selected = app.selected;\n')
          replace_once('src/app/tests.rs', prefix, prefix +
              '    // An idle navigation watch has no independent active-work owner.\n'
              '    app.threads[selected].runtime = RuntimeStatus::Ready;\n')
          prefix = ('fn idle_interrupt_exits_thread_and_releases_watch() {\n'
                    '    let mut app = app();\n')
          replace_once('src/app/tests.rs', prefix, prefix +
              '    // Make the idle premise explicit instead of inheriting a working fixture.\n'
              '    let selected = app.selected;\n'
              '    app.threads[selected].runtime = RuntimeStatus::Ready;\n')
          lines = len(Path('src/app/tests.rs').read_text(encoding='utf-8').splitlines())
          assert lines == 2955, lines
          replace_once('release/v1.4-plan.json',
              '"src/app/tests.rs": 2950', '"src/app/tests.rs": 2955')
          PY
          git diff --check
          python3 scripts/architecture/check_module_ratchet.py release/v1.4-plan.json
          test "$(git ls-remote origin refs/heads/fix/conversation-watch-ownership-20261013 | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/app/reducer.rs src/app/tests.rs release/v1.4-plan.json
          git commit -m 'fix(app): align idle navigation fixtures with watch ownership and rustfmt'
          git push origin HEAD:refs/heads/fix/conversation-watch-ownership-20261013
