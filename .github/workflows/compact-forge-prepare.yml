name: compact-forge-prepare
on:
  push:
    branches: [fix/runtime-audit-f1-f3]
    paths: [.github/workflows/compact-forge-prepare.yml]
permissions:
  contents: write
concurrency:
  group: compact-forge-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EVIDENCE: /tmp/compact-forge-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Apply reviewed hash-bound correction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          python3 - <<'PY'
          import hashlib, os, subprocess
          from pathlib import Path
          base='e6a47aa995b986f82ceedf43889ab4cf20ab9ec1'
          allowed={'.compact-forge.patch','.github/workflows/compact-forge-prepare.yml'}
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          if changed != allowed: raise SystemExit('unexpected base diff: '+repr(changed))
          patch=Path('.compact-forge.patch').read_bytes()
          if hashlib.sha256(patch).hexdigest() != '7a59cc0c0d25f4d43160a6f8115a43c2c0b1d591b8e14e5137cb50cfccc0dd05': raise SystemExit('patch checksum mismatch')
          p=Path(os.environ['EVIDENCE'])/'reviewed.patch'; p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply',str(p)],check=True)
          Path('.compact-forge.patch').unlink()
          PY
      - name: Retain failing inline-buffer control
        shell: bash
        run: |
          set -euo pipefail
          cp src/forge.rs "$RUNNER_TEMP/compact-forge.rs"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/forge.rs'); s=p.read_text(); old='let mut buffer = vec![0_u8; 8192];'
          if s.count(old)!=1: raise SystemExit('reader source mismatch')
          p.write_text(s.replace(old,'let mut buffer = [0_u8; 8192];'))
          PY
          set +e
          cargo test --locked --lib forge::tests::command_io_futures_do_not_embed_read_buffers -- --exact --nocapture > "$EVIDENCE/inline-buffer-negative.log" 2>&1
          result=$?
          set -e
          cp "$RUNNER_TEMP/compact-forge.rs" src/forge.rs
          test "$result" != 0
          grep -E 'reader future embeds [0-9]+ bytes' "$EVIDENCE/inline-buffer-negative.log"
          grep -F '0 passed; 1 failed' "$EVIDENCE/inline-buffer-negative.log"
          cargo test --locked --lib forge::tests::command_io_futures_do_not_embed_read_buffers -- --exact --nocapture 2>&1 | tee "$EVIDENCE/compact-future-positive.log"
      - name: Qualify source and full Linux tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee "$EVIDENCE/clippy.log"
          cargo test --locked --all-targets --all-features 2>&1 | tee "$EVIDENCE/tests.log"
          python3 scripts/docs/check_docs.py
          python3 scripts/architecture/check_module_ratchet.py release/v1.4-plan.json
          python3 scripts/architecture/check_first_deployment.py
          python3 scripts/architecture/check_upstream_convergence.py
          git diff --check
      - name: Push repair source for maintainer cleanup and canonical validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/runtime-audit-f1-f3 | cut -f1)" = "$GITHUB_SHA"
          git config user.name github-actions\[bot\]
          git config user.email 41898282+github-actions\[bot\]@users.noreply.github.com
          git add -A
          git commit -m 'fix(forge): heap-own scoped read buffers to bound nested async state'
          git rev-parse HEAD > "$EVIDENCE/source-sha.txt"
          git rev-parse HEAD^{tree} > "$EVIDENCE/source-tree.txt"
          git archive --format=tar.gz HEAD > "$EVIDENCE/source-with-cleanup-hook.tar.gz"
          git diff e6a47aa995b986f82ceedf43889ab4cf20ab9ec1 HEAD > "$EVIDENCE/qualified.patch"
          git push origin HEAD:refs/heads/fix/runtime-audit-f1-f3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: compact-forge-preparation-${{ github.run_id }}
          path: /tmp/compact-forge-evidence/
          if-no-files-found: warn
          retention-days: 30
