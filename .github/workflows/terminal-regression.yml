name: terminal-regression

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/terminal_restoration.rs'
      - 'scripts/testing/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/terminal-regression.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/terminal_restoration.rs'
      - 'scripts/testing/**'
      - '.github/workflows/terminal-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terminal-regression-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-pty:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CODEX_TUI_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CODEX_TUI_PTY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify checkout identity and probe negative fixtures
        run: |
          test "$(git rev-parse HEAD)" = "$CODEX_TUI_PTY_SOURCE_SHA"
          python3 -m unittest discover -s scripts/testing -p 'test_terminal_*.py'
          python3 -O -m unittest discover -s scripts/testing -p 'test_terminal_*.py'
      - name: Exercise the actual program on a controlling PTY
        env:
          CODEX_TUI_PTY_EVIDENCE_DIR: ${{ runner.temp }}/terminal-regression
        run: cargo test --locked --test terminal_restoration -- --nocapture
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success()
        with:
          name: automated-pty-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/terminal-regression/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: automated-pty-partial-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/terminal-regression/
          if-no-files-found: warn
          retention-days: 30
