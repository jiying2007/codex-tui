name: audit-proven-branch-cleanup
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/audit-proven-branch-cleanup.yml']
permissions:
  contents: read
jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/v1.4-alias-identity'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d4bef0b902069601ba6f4c2d436cd63fa38203a2
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate the scoped historical head and apply atomic lease deletion
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d4bef0b902069601ba6f4c2d436cd63fa38203a2
          PLAN="$RUNNER_TEMP/proven-branch-plan.json"
          ARGS=(--repo "$GITHUB_REPOSITORY" --output "$PLAN" --only-branch fix/v1.4-audit-closure --expected-head 0d55f77600e65fe84eb27d6a425b191affd652d9)
          python3 scripts/repository/branch_hygiene.py "${ARGS[@]}"
          python3 - <<'PY'
          import json,os,pathlib
          plan=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'proven-branch-plan.json').read_text())
          if len(plan['entries']) != 1: raise SystemExit('expected the one observed historical branch')
          entry=plan['entries'][0]
          if entry['decision'] != 'delete' or entry['mergedPr'] != 216 or entry['reason'] != 'exact-merged-squash-tree-delta':
              raise SystemExit('historical equivalence proof changed; refusing deletion')
          PY
          DIGEST="$(sha256sum "$PLAN" | cut -d ' ' -f 1)"
          gh auth setup-git
          python3 scripts/repository/branch_hygiene.py "${ARGS[@]}" --apply --confirm-repository "$GITHUB_REPOSITORY" --plan-sha256 "$DIGEST"
          python3 - <<'PY'
          import json,os,pathlib
          receipt=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'proven-branch-plan.receipt.json').read_text())
          if receipt['deletedCount']!=1 or 'fix/v1.4-audit-closure' in receipt['remainingBranches']: raise SystemExit('deletion receipt mismatch')
          print('PROVEN_BRANCH_CLEANUP='+json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: proven-historical-branch-cleanup
          path: ${{ runner.temp }}/proven-branch-plan*.json
          if-no-files-found: error
          retention-days: 90
