name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  msrv:
    name: rust-1.88-msrv
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check declared Rust 1.88 MSRV
        run: cargo check --locked --all-targets --all-features

  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        if: runner.os == 'Linux'
        with:
          python-version: "3.8"
      - uses: Swatinem/rust-cache@v2
      - name: Smoke release tools on Python 3.8
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python --version
          OUT="$RUNNER_TEMP/release-py38"
          mkdir -p "$OUT"

          python scripts/release/create_terminal_receipt.py             --platform linux             --terminal ci-python38             --source-sha 0123456789abcdef0123456789abcdef01234567             --pass             --output "$OUT/terminal.json"

          cat > "$OUT/failure-matrix.json" <<'EOF'
          {
            "schema": "codex-tui/failure-matrix/v2",
            "cases": [
              {
                "id": "fixture",
                "evidence": ["fixture::test"]
              }
            ]
          }
          EOF

          cat > "$OUT/scale.json" <<'EOF'
          {
            "schema": "codex-tui/scale-evidence/v4",
            "rows": 50000,
            "warmupIterations": 5,
            "iterations": 50,
            "registryConstructMs": 1.0,
            "planningReconcile": {"p50Ms": 1.0, "p95Ms": 2.0, "p99Ms": 3.0, "maxMs": 4.0},
            "recentProjection": {"p50Ms": 1.0, "p95Ms": 2.0, "p99Ms": 3.0, "maxMs": 4.0},
            "allHistoryProjection": {"p50Ms": 1.0, "p95Ms": 2.0, "p99Ms": 3.0, "maxMs": 4.0},
            "searchProjection": {"p50Ms": 1.0, "p95Ms": 2.0, "p99Ms": 3.0, "maxMs": 4.0},
            "hostLocalProjection": {"p50Ms": 1.0, "p95Ms": 2.0, "p99Ms": 3.0, "maxMs": 4.0}
          }
          EOF

          cat > "$OUT/soak.json" <<'EOF'
          {
            "schema": "codex-tui/soak-evidence/v1",
            "rows": 50000,
            "cycles": 256,
            "uiOnlyPlanningReconciles": 0,
            "structuralPass": true
          }
          EOF

          cat > "$OUT/support-snapshot.json" <<'EOF'
          {
            "schema": "codex-tui/support-bundle/v1",
            "build": {
              "productVersion": "1.2.0",
              "sourceSha": "0123456789abcdef0123456789abcdef01234567"
            }
          }
          EOF

          cat > "$OUT/support-manifest.json" <<'EOF'
          {
            "schema": "codex-tui/support-bundle/v1",
            "privacy": [
              "no-environment-variables",
              "no-authentication-tokens",
              "no-prompts-or-transcripts",
              "no-comment-bodies",
              "no-repository-or-file-paths",
              "no-raw-errors"
            ]
          }
          EOF

          python scripts/release/create_automated_qualification.py \
            --output "$OUT/automated-qualification.json" \
            --commit 0123456789abcdef0123456789abcdef01234567 \
            --failure-matrix "$OUT/failure-matrix.json" \
            --scale "$OUT/scale.json" \
            --soak "$OUT/soak.json" \
            --support-manifest "$OUT/support-manifest.json" \
            --support-snapshot "$OUT/support-snapshot.json"

          python - "$OUT/automated-qualification.json" <<'PY'
          import json
          import re
          import sys
          receipt = json.load(open(sys.argv[1], encoding="utf-8"))
          assert receipt["schema"] == "codex-tui/automated-qualification/v3"
          assert receipt["sourceSha"] == "0123456789abcdef0123456789abcdef01234567"
          assert all(value == "pass" for value in receipt["gates"].values())
          expected = {
              "failureMatrixSha256",
              "scaleEvidenceSha256",
              "soakEvidenceSha256",
              "supportManifestSha256",
              "supportSnapshotSha256",
          }
          assert set(receipt["artifacts"]) == expected
          assert all(re.fullmatch(r"[0-9a-f]{64}", value) for value in receipt["artifacts"].values())
          PY

          python scripts/release/create_development_qualification.py \
            --output "$OUT/development-qualification.json" \
            --automated-qualification "$OUT/automated-qualification.json" \
            --commit 0123456789abcdef0123456789abcdef01234567

          python - "$OUT/development-qualification.json" <<'PY'
          import json
          import sys

          receipt = json.load(open(sys.argv[1], encoding="utf-8"))
          assert receipt["schema"] == "codex-tui/development-qualification/v1"
          assert receipt["targetVersion"] == "1.2.0"
          assert receipt["sourceSha"] == "0123456789abcdef0123456789abcdef01234567"
          assert receipt["scopeCompletion"]["status"] == "pass"
          assert receipt["scopeCompletion"]["stableReady"] is False
          assert receipt["scopeCompletion"]["publicationAllowed"] is False
          assert receipt["repositoryAutomatedQualification"]["status"] == "pass"
          assert receipt["moduleRatchet"]["status"] == "pass"
          assert receipt["protocolReplay"]["status"] == "pass"
          assert receipt["stableReady"] is False
          assert receipt["publicationAllowed"] is False
          assert receipt["authority"] == "hosted-development-only"
          PY

          python scripts/release/create_evidence.py             --output "$OUT/evidence.json"             --compat-schema codex-tui/compat/v2             --version 1.0.0             --commit 0123456789abcdef0123456789abcdef01234567             --canonical-ci-run 1             --automated-qualification "$OUT/automated-qualification.json"             --linux-source-sha 0123456789abcdef0123456789abcdef01234567             --linux-compat-sha256 "$(printf 'a%.0s' {1..64})"             --linux-compat-observed-at 2026-09-30T00:00:00Z             --linux-terminal ci-python38             --linux-terminal-observed-at 2026-09-30T00:00:00Z             --performance-source-sha 0123456789abcdef0123456789abcdef01234567             --performance-iterations 200             --performance-p95-ms 1             --performance-p99-ms 2             --performance-source ci-python38             --performance-observed-at 2026-09-30T00:00:00Z

          cat > "$OUT/prior-stable-run.json" <<'EOF'
          {
            "id": 77,
            "name": "release",
            "path": ".github/workflows/release.yml",
            "event": "workflow_dispatch",
            "conclusion": "success",
            "head_branch": "main",
            "head_sha": "0123456789abcdef0123456789abcdef01234567"
          }
          EOF

          cat > "$OUT/prior-stable-verification.json" <<'EOF'
          {
            "schema": "codex-tui/release-verification/v1",
            "channel": "stable",
            "tag": "v1.0.0",
            "version": "1.0.0",
            "commitSha": "0123456789abcdef0123456789abcdef01234567",
            "publish": false,
            "valid": true,
            "blockers": [],
            "cargoLockPresent": true,
            "changelogVersionPresent": true,
            "projectLicensePresent": true,
            "stableCriteriaPresent": true,
            "evidenceStatus": "verified"
          }
          EOF

          python - "$OUT/evidence.json" "$OUT/prior-stable-evidence.json" <<'PY'
          import copy
          import json
          import sys

          evidence = json.load(open(sys.argv[1], encoding="utf-8"))
          evidence = copy.deepcopy(evidence)
          evidence["automatedQualification"]["artifacts"]["scaleEvidenceSha256"] = "b" * 64
          with open(sys.argv[2], "w", encoding="utf-8", newline="\n") as handle:
              json.dump(evidence, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

          python scripts/release/validate_stable_dry_run.py \
            --run-json "$OUT/prior-stable-run.json" \
            --verification "$OUT/prior-stable-verification.json" \
            --evidence "$OUT/prior-stable-evidence.json" \
            --current-evidence "$OUT/evidence.json" \
            --commit 0123456789abcdef0123456789abcdef01234567 \
            --version 1.0.0 \
            --tag v1.0.0

          python - "$OUT/evidence.json" "$OUT/evidence-drift.json" <<'PY'
          import json
          import sys

          evidence = json.load(open(sys.argv[1], encoding="utf-8"))
          evidence["performance"]["p95Ms"] = 9.0
          with open(sys.argv[2], "w", encoding="utf-8", newline="\n") as handle:
              json.dump(evidence, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

          if python scripts/release/validate_stable_dry_run.py \
            --run-json "$OUT/prior-stable-run.json" \
            --verification "$OUT/prior-stable-verification.json" \
            --evidence "$OUT/prior-stable-evidence.json" \
            --current-evidence "$OUT/evidence-drift.json" \
            --commit 0123456789abcdef0123456789abcdef01234567 \
            --version 1.0.0 \
            --tag v1.0.0; then
            echo "expected stable dry-run evidence drift validation to fail" >&2
            exit 1
          fi

          if python scripts/release/create_evidence.py             --output "$OUT/evidence-mismatch.json"             --compat-schema codex-tui/compat/v2             --version 1.0.0             --commit 0123456789abcdef0123456789abcdef01234567             --canonical-ci-run 1             --automated-qualification "$OUT/automated-qualification.json"             --linux-source-sha 1123456789abcdef0123456789abcdef01234567             --linux-compat-sha256 "$(printf 'a%.0s' {1..64})"             --linux-compat-observed-at 2026-09-30T00:00:00Z             --linux-terminal ci-python38             --linux-terminal-observed-at 2026-09-30T00:00:00Z             --performance-source-sha 0123456789abcdef0123456789abcdef01234567             --performance-iterations 200             --performance-p95-ms 1             --performance-p99-ms 2             --performance-source ci-python38             --performance-observed-at 2026-09-30T00:00:00Z; then
            echo "expected cross-SHA real evidence to fail" >&2
            exit 1
          fi

          python scripts/release/extract_changelog.py             --version 1.0.0             --require-released             --output "$OUT/RELEASE_NOTES.md"

          cat > "$OUT/CHANGELOG-unreleased.md" <<'EOF'
          # Changelog

          ## [9.9.9] - Unreleased

          ### Release status

          Ready for preview only.
          EOF
          if python scripts/release/extract_changelog.py               --version 9.9.9               --changelog "$OUT/CHANGELOG-unreleased.md"               --require-released               --output "$OUT/unreleased-notes.md"; then
            echo "expected unreleased changelog validation to fail" >&2
            exit 1
          fi

          cat > "$OUT/CHANGELOG-stale.md" <<'EOF'
          # Changelog

          ## [9.9.8] - 2099-01-01

          ### Release status

          This version is not yet published as a stable release.
          EOF
          if python scripts/release/extract_changelog.py               --version 9.9.8               --changelog "$OUT/CHANGELOG-stale.md"               --require-released               --output "$OUT/stale-notes.md"; then
            echo "expected stale publication wording validation to fail" >&2
            exit 1
          fi

          python scripts/release/checksums.py "$OUT"             --output "$OUT/SHA256SUMS"

          python scripts/release/capture_compat.py --help >/dev/null
          python scripts/release/capture_forge_capability.py --help >/dev/null
          python scripts/release/validate_v1_2_plan.py >/dev/null
          python scripts/release/validate_v1_2_completion.py >/dev/null

          FAKE_FORGE="$OUT/fake-codex-tui"
          cat > "$FAKE_FORGE" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          test "$1" = doctor
          test "$2" = bundle
          test "$3" = --output
          mkdir -p "$4"
          cat > "$4/snapshot.json" <<'JSON'
          {
            "schema": "codex-tui/support-bundle/v1",
            "generatedAtUnixMs": 1,
            "build": {
              "productVersion": "1.1.0",
              "sourceSha": "0123456789abcdef0123456789abcdef01234567",
              "os": "linux",
              "arch": "x86_64"
            },
            "forge": {
              "provider": "git-lab",
              "clientName": "glab",
              "clientVersion": "fixture",
              "authenticated": true,
              "serverVersion": "fixture",
              "serverEdition": "self-managed",
              "serverTier": null,
              "freshness": "fresh",
              "capabilities": {
                "issues": "available",
                "merge-requests": "available",
                "pipelines": "available"
              },
              "recentIssues": 1,
              "openChangeRequests": 2,
              "recentPipelines": 3,
              "issueBoards": 0,
              "errorCode": null
            }
          }
          JSON
          SH
          chmod +x "$FAKE_FORGE"

          python scripts/release/capture_forge_capability.py \
            --binary "$FAKE_FORGE" \
            --output "$OUT/provider-pass.json" \
            --expected-provider gitlab \
            --expected-source-sha 0123456789abcdef0123456789abcdef01234567 \
            --require-authenticated \
            --required-capability issues=available \
            --required-capability merge-requests=available \
            --required-capability pipelines=available >/dev/null

          python - "$OUT/provider-pass.json" <<'PY'
          import json
          import sys
          fixture = json.load(open(sys.argv[1], encoding="utf-8"))
          assert fixture["schema"] == "codex-tui/forge-capability-fixture/v1"
          assert fixture["qualified"] is True
          assert fixture["forge"]["provider"] == "gitlab"
          assert fixture["forge"]["authenticated"] is True
          assert fixture["blockers"] == []
          assert "no-authentication-tokens" in fixture["privacy"]
          assert "no-repository-paths" in fixture["privacy"]
          PY

          if python scripts/release/capture_forge_capability.py \
            --binary "$FAKE_FORGE" \
            --output "$OUT/provider-fail.json" \
            --expected-provider gitlab \
            --required-capability issues=unavailable >/dev/null; then
            echo "expected provider qualification mismatch to fail" >&2
            exit 1
          else
            CODE=$?
            test "$CODE" -eq 3
            test -s "$OUT/provider-fail.json"
          fi

          python scripts/release/create_automated_qualification.py --help >/dev/null
          python scripts/release/generate_notices.py --help >/dev/null
          python scripts/release/package_release.py --help >/dev/null
          python scripts/release/verify_archive.py --help >/dev/null
          python scripts/release/validate_ci_run.py --help >/dev/null
          python scripts/release/validate_stable_dry_run.py --help >/dev/null
          python scripts/release/linux_qualify.py --help >/dev/null
          PYTHONPATH=scripts/release python -c 'import linux_qualify as q; assert q.stable_version_allowed("1.0.0"); assert q.stable_version_allowed("1.1.0"); assert q.stable_version_allowed("2.3.4"); assert not q.stable_version_allowed("0.9.0"); assert not q.stable_version_allowed("1.1.0-rc.1"); assert not q.stable_version_allowed("01.1.0")'
      - name: Verify Python scripts parse
        run: python -c "import pathlib, py_compile; [py_compile.compile(str(p), doraise=True) for p in pathlib.Path('scripts').rglob('*.py')]"
      - name: Enforce v1.2 module no-growth ratchet
        run: python scripts/architecture/check_module_ratchet.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
