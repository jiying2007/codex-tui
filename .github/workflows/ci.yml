name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  msrv:
    name: rust-1.88-msrv
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check declared Rust 1.88 MSRV
        run: cargo check --locked --all-targets --all-features

  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        include:
          - os: ubuntu-24.04
            container: ubuntu:20.04
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Prepare Linux ABI baseline
        if: runner.os == 'Linux'
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config curl ca-certificates git python3 python-is-python3 binutils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Smoke release tools on Python 3.8
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path(".github/workflows/release.yml")
          lines = path.read_text(encoding="utf-8").splitlines()
          in_dispatch = False
          in_inputs = False
          count = 0
          for line in lines:
              if line.startswith("  workflow_dispatch:"):
                  in_dispatch = True
                  continue
              if in_dispatch and line.startswith("    inputs:"):
                  in_inputs = True
                  continue
              if not in_inputs:
                  continue
              if line and not line.startswith(" "):
                  break
              if line.startswith("  ") and not line.startswith("      ") and line.strip():
                  break
              if re.match(r"^ {6}[A-Za-z0-9_-]+:\s*$", line):
                  count += 1

          if not in_inputs:
              raise SystemExit("release workflow_dispatch.inputs block not found")
          if count > 25:
              raise SystemExit(
                  f"release workflow_dispatch defines {count} top-level inputs; GitHub maximum is 25"
              )
          print(f"release workflow_dispatch inputs: {count}/25")
          PY
          OUT="$RUNNER_TEMP/release-py38"
          mkdir -p "$OUT"

          python scripts/release/create_terminal_receipt.py             --platform linux             --terminal ci-python38             --source-sha 0123456789abcdef0123456789abcdef01234567             --pass             --output "$OUT/terminal.json"

          cat > "$OUT/failure-matrix.json" <<'EOF'
          {
            "schema": "codex-tui/failure-matrix/v2",
            "cases": [
              {
                "id": "fixture",
                "evidence": ["fixture::test"]
              }
            ]
          }
          EOF

          python scripts/release/diagnostic_fixtures.py --output "$OUT"

          python scripts/release/create_automated_qualification.py \
            --output "$OUT/automated-qualification.json" \
            --commit 0123456789abcdef0123456789abcdef01234567 \
            --failure-matrix "$OUT/failure-matrix.json" \
            --scale "$OUT/scale.json" \
            --soak "$OUT/soak.json" \
            --support-manifest "$OUT/support-manifest.json" \
            --support-snapshot "$OUT/support-snapshot.json"

          python - "$OUT/automated-qualification.json" <<'PY'
          import json
          import re
          import sys
          receipt = json.load(open(sys.argv[1], encoding="utf-8"))
          assert receipt["schema"] == "codex-tui/automated-qualification/v3"
          assert receipt["sourceSha"] == "0123456789abcdef0123456789abcdef01234567"
          assert all(value == "pass" for value in receipt["gates"].values())
          expected = {
              "failureMatrixSha256",
              "scaleEvidenceSha256",
              "soakEvidenceSha256",
              "supportManifestSha256",
              "supportSnapshotSha256",
          }
          assert set(receipt["artifacts"]) == expected
          assert all(re.fullmatch(r"[0-9a-f]{64}", value) for value in receipt["artifacts"].values())
          PY

          python scripts/release/create_development_qualification.py \
            --output "$OUT/development-qualification.json" \
            --automated-qualification "$OUT/automated-qualification.json" \
            --commit 0123456789abcdef0123456789abcdef01234567

          python - "$OUT/development-qualification.json" <<'PY'
          import json
          import sys

          receipt = json.load(open(sys.argv[1], encoding="utf-8"))
          assert receipt["schema"] == "codex-tui/development-qualification/v1"
          assert receipt["targetVersion"] == "1.4.0"
          assert receipt["planSchema"] == "codex-tui/v1.4-plan/v1"
          assert receipt["sourceSha"] == "0123456789abcdef0123456789abcdef01234567"
          assert receipt["scopeCompletion"]["status"] == "pass"
          assert receipt["scopeCompletion"]["stableReady"] is False
          assert receipt["scopeCompletion"]["publicationAllowed"] is False
          assert receipt["repositoryAutomatedQualification"]["status"] == "pass"
          assert receipt["moduleRatchet"]["status"] == "pass"
          assert receipt["protocolReplay"]["status"] == "pass"
          assert receipt["stableReady"] is False
          assert receipt["publicationAllowed"] is False
          assert receipt["authority"] == "hosted-development-only"
          PY

          python scripts/release/create_evidence.py             --output "$OUT/evidence.json"             --compat-schema codex-tui/compat/v2             --version 1.0.0             --commit 0123456789abcdef0123456789abcdef01234567             --canonical-ci-run 1             --automated-qualification "$OUT/automated-qualification.json"             --linux-source-sha 0123456789abcdef0123456789abcdef01234567             --linux-compat-sha256 "$(printf 'a%.0s' {1..64})"             --linux-compat-observed-at 2026-09-30T00:00:00Z             --linux-terminal ci-python38             --linux-terminal-observed-at 2026-09-30T00:00:00Z             --performance-source-sha 0123456789abcdef0123456789abcdef01234567             --performance-iterations 200             --performance-p95-ms 1             --performance-p99-ms 2             --performance-source ci-python38             --performance-observed-at 2026-09-30T00:00:00Z

          PYTHONPATH=scripts/release python - "$OUT/evidence.json" <<'PY'
          import json
          import sys

          import stable_publish

          evidence = json.load(open(sys.argv[1], encoding="utf-8"))
          inputs = stable_publish.stable_publish_inputs(evidence, 77)
          assert inputs["channel"] == "stable"
          assert inputs["publish"] == "true"
          assert inputs["canonical_ci_run"] == "1"
          assert inputs["stable_qualification_run"] == "77"
          assert inputs["linux_compat_sha256"] == "a" * 64
          assert inputs["linux_terminal"] == "ci-python38"
          assert inputs["performance_source_sha"] == "0123456789abcdef0123456789abcdef01234567"
          assert "linux_source_sha" not in inputs
          assert len(inputs) == 14
          assert stable_publish.STABLE_VERSION.fullmatch("1.4.0")
          assert not stable_publish.STABLE_VERSION.fullmatch("1.4.0-rc.1")
          assert not stable_publish.STABLE_VERSION.fullmatch("0.9.0")

          broken = json.loads(json.dumps(evidence))
          del broken["terminalRestoration"]["linux"]
          try:
              stable_publish.stable_publish_inputs(broken, 77)
          except SystemExit:
              pass
          else:
              raise AssertionError("expected missing Linux terminal restoration to fail")
          PY

          cat > "$OUT/prior-stable-run.json" <<'EOF'
          {
            "id": 77,
            "name": "release",
            "path": ".github/workflows/release.yml",
            "event": "workflow_dispatch",
            "conclusion": "success",
            "head_branch": "main",
            "head_sha": "0123456789abcdef0123456789abcdef01234567"
          }
          EOF

          cat > "$OUT/prior-stable-verification.json" <<'EOF'
          {
            "schema": "codex-tui/release-verification/v1",
            "channel": "stable",
            "tag": "v1.0.0",
            "version": "1.0.0",
            "commitSha": "0123456789abcdef0123456789abcdef01234567",
            "publish": false,
            "valid": true,
            "blockers": [],
            "cargoLockPresent": true,
            "changelogVersionPresent": true,
            "projectLicensePresent": true,
            "stableCriteriaPresent": true,
            "evidenceStatus": "verified"
          }
          EOF

          python - "$OUT/evidence.json" "$OUT/prior-stable-evidence.json" <<'PY'
          import copy
          import json
          import sys

          evidence = json.load(open(sys.argv[1], encoding="utf-8"))
          evidence = copy.deepcopy(evidence)
          evidence["automatedQualification"]["artifacts"]["scaleEvidenceSha256"] = "b" * 64
          with open(sys.argv[2], "w", encoding="utf-8", newline="\n") as handle:
              json.dump(evidence, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

          python scripts/release/validate_stable_dry_run.py \
            --run-json "$OUT/prior-stable-run.json" \
            --verification "$OUT/prior-stable-verification.json" \
            --evidence "$OUT/prior-stable-evidence.json" \
            --current-evidence "$OUT/evidence.json" \
            --commit 0123456789abcdef0123456789abcdef01234567 \
            --version 1.0.0 \
            --tag v1.0.0

          python - "$OUT/evidence.json" "$OUT/evidence-drift.json" <<'PY'
          import json
          import sys

          evidence = json.load(open(sys.argv[1], encoding="utf-8"))
          evidence["performance"]["p95Ms"] = 9.0
          with open(sys.argv[2], "w", encoding="utf-8", newline="\n") as handle:
              json.dump(evidence, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

          if python scripts/release/validate_stable_dry_run.py \
            --run-json "$OUT/prior-stable-run.json" \
            --verification "$OUT/prior-stable-verification.json" \
            --evidence "$OUT/prior-stable-evidence.json" \
            --current-evidence "$OUT/evidence-drift.json" \
            --commit 0123456789abcdef0123456789abcdef01234567 \
            --version 1.0.0 \
            --tag v1.0.0; then
            echo "expected stable dry-run evidence drift validation to fail" >&2
            exit 1
          fi

          if python scripts/release/create_evidence.py             --output "$OUT/evidence-mismatch.json"             --compat-schema codex-tui/compat/v2             --version 1.0.0             --commit 0123456789abcdef0123456789abcdef01234567             --canonical-ci-run 1             --automated-qualification "$OUT/automated-qualification.json"             --linux-source-sha 1123456789abcdef0123456789abcdef01234567             --linux-compat-sha256 "$(printf 'a%.0s' {1..64})"             --linux-compat-observed-at 2026-09-30T00:00:00Z             --linux-terminal ci-python38             --linux-terminal-observed-at 2026-09-30T00:00:00Z             --performance-source-sha 0123456789abcdef0123456789abcdef01234567             --performance-iterations 200             --performance-p95-ms 1             --performance-p99-ms 2             --performance-source ci-python38             --performance-observed-at 2026-09-30T00:00:00Z; then
            echo "expected cross-SHA real evidence to fail" >&2
            exit 1
          fi

          python scripts/release/extract_changelog.py             --version 1.0.0             --require-released             --output "$OUT/RELEASE_NOTES.md"

          cat > "$OUT/CHANGELOG-unreleased.md" <<'EOF'
          # Changelog

          ## [9.9.9] - Unreleased

          ### Release status

          Ready for preview only.
          EOF
          if python scripts/release/extract_changelog.py               --version 9.9.9               --changelog "$OUT/CHANGELOG-unreleased.md"               --require-released               --output "$OUT/unreleased-notes.md"; then
            echo "expected unreleased changelog validation to fail" >&2
            exit 1
          fi

          cat > "$OUT/CHANGELOG-stale.md" <<'EOF'
          # Changelog

          ## [9.9.8] - 2099-01-01

          ### Release status

          This version is not yet published as a stable release.
          EOF
          if python scripts/release/extract_changelog.py               --version 9.9.8               --changelog "$OUT/CHANGELOG-stale.md"               --require-released               --output "$OUT/stale-notes.md"; then
            echo "expected stale publication wording validation to fail" >&2
            exit 1
          fi

          python scripts/release/checksums.py "$OUT"             --output "$OUT/SHA256SUMS"

          python scripts/release/capture_compat.py --help >/dev/null
          python scripts/release/capture_forge_capability.py --help >/dev/null
          python scripts/release/validate_v1_4_plan.py >/dev/null
          python scripts/release/validate_v1_4_completion.py >/dev/null

          FAKE_FORGE="$OUT/fake-codex-tui"
          cat > "$FAKE_FORGE" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          test "$1" = doctor
          test "$2" = bundle
          test "$3" = --output
          mkdir -p "$4"
          cat > "$4/snapshot.json" <<'JSON'
          {
            "schema": "codex-tui/support-bundle/v1",
            "generatedAtUnixMs": 1,
            "build": {
              "productVersion": "1.1.0",
              "sourceSha": "0123456789abcdef0123456789abcdef01234567",
              "os": "linux",
              "arch": "x86_64"
            },
            "forge": {
              "provider": "git-lab",
              "clientName": "glab",
              "clientVersion": "fixture",
              "authenticated": true,
              "serverVersion": "fixture",
              "serverEdition": "self-managed",
              "serverTier": null,
              "freshness": "fresh",
              "capabilities": {
                "issues": "available",
                "merge-requests": "available",
                "pipelines": "available"
              },
              "recentIssues": 1,
              "openChangeRequests": 2,
              "recentPipelines": 3,
              "issueBoards": 0,
              "errorCode": null
            }
          }
          JSON
          SH
          chmod +x "$FAKE_FORGE"

          python scripts/release/capture_forge_capability.py \
            --binary "$FAKE_FORGE" \
            --output "$OUT/provider-pass.json" \
            --expected-provider gitlab \
            --expected-source-sha 0123456789abcdef0123456789abcdef01234567 \
            --require-authenticated \
            --required-capability issues=available \
            --required-capability merge-requests=available \
            --required-capability pipelines=available >/dev/null

          python - "$OUT/provider-pass.json" <<'PY'
          import json
          import sys
          fixture = json.load(open(sys.argv[1], encoding="utf-8"))
          assert fixture["schema"] == "codex-tui/forge-capability-fixture/v1"
          assert fixture["qualified"] is True
          assert fixture["forge"]["provider"] == "gitlab"
          assert fixture["forge"]["authenticated"] is True
          assert fixture["blockers"] == []
          assert "no-authentication-tokens" in fixture["privacy"]
          assert "no-repository-paths" in fixture["privacy"]
          PY

          if python scripts/release/capture_forge_capability.py \
            --binary "$FAKE_FORGE" \
            --output "$OUT/provider-fail.json" \
            --expected-provider gitlab \
            --required-capability issues=unavailable >/dev/null; then
            echo "expected provider qualification mismatch to fail" >&2
            exit 1
          else
            CODE=$?
            test "$CODE" -eq 3
            test -s "$OUT/provider-fail.json"
          fi

          python scripts/release/create_automated_qualification.py --help >/dev/null
          python scripts/release/generate_notices.py --help >/dev/null
          python scripts/release/package_release.py --help >/dev/null
          python scripts/release/verify_archive.py --help >/dev/null
          python scripts/release/validate_ci_run.py --help >/dev/null
          cat > "$OUT/main-unprotected.json" <<'EOF'
          {
            "name": "main",
            "commit": {"sha": "0123456789abcdef0123456789abcdef01234567"},
            "protected": false
          }
          EOF

          cat > "$OUT/main-protected.json" <<'EOF'
          {
            "name": "main",
            "commit": {"sha": "0123456789abcdef0123456789abcdef01234567"},
            "protected": true
          }
          EOF

          python scripts/release/validate_release_branch_state.py \
            --branch-json "$OUT/main-unprotected.json" \
            --commit 0123456789abcdef0123456789abcdef01234567

          python scripts/release/validate_release_branch_state.py \
            --branch-json "$OUT/main-protected.json" \
            --commit 0123456789abcdef0123456789abcdef01234567 \
            --require-protected

          if python scripts/release/validate_release_branch_state.py \
            --branch-json "$OUT/main-unprotected.json" \
            --commit 0123456789abcdef0123456789abcdef01234567 \
            --require-protected; then
            echo "expected stable publication on an unprotected main branch to fail" >&2
            exit 1
          fi

          if python scripts/release/validate_release_branch_state.py \
            --branch-json "$OUT/main-protected.json" \
            --commit 1123456789abcdef0123456789abcdef01234567; then
            echo "expected stable qualification after main drift to fail" >&2
            exit 1
          fi

          python scripts/release/validate_stable_dry_run.py --help >/dev/null
          python scripts/release/validate_release_branch_state.py --help >/dev/null
          python scripts/release/stable_publish.py --help >/dev/null
          python scripts/release/finalize_release.py --help >/dev/null
          python scripts/release/terminal_smoke.py --help >/dev/null
          python scripts/release/configure_main_protection.py --help >/dev/null
          python scripts/release/validate_v1_4_plan.py
          python scripts/release/validate_v1_4_completion.py
          python scripts/release/linux_qualify.py --help >/dev/null
          PYTHONPATH=scripts/release python - <<'PY'
          import configure_main_protection as p

          policy = p.protection_payload()
          assert policy["required_status_checks"]["strict"] is True
          assert tuple(policy["required_status_checks"]["contexts"]) == p.REQUIRED_CHECKS
          assert policy["enforce_admins"] is True
          assert policy["required_pull_request_reviews"] is None
          assert policy["restrictions"] is None
          assert policy["allow_force_pushes"] is False
          assert policy["allow_deletions"] is False

          ci_text = open(".github/workflows/ci.yml", encoding="utf-8").read()
          p.validate_ci_contract(ci_text)

          sha = "0123456789abcdef0123456789abcdef01234567"
          checks = {
              "check_runs": [
                  {
                      "name": name,
                      "status": "completed",
                      "conclusion": "success",
                      "app": {"slug": "github-actions", "id": 15368},
                  }
                  for name in p.REQUIRED_CHECKS
              ]
          }
          assert p.validate_check_runs(checks, sha) == 15368

          broken = {"check_runs": checks["check_runs"][:-1]}
          try:
              p.validate_check_runs(broken, sha)
          except SystemExit:
              pass
          else:
              raise AssertionError("expected missing canonical check to fail")

          applied = {
              "required_status_checks": {
                  "strict": True,
                  "contexts": list(p.REQUIRED_CHECKS),
              },
              "enforce_admins": {"enabled": True},
              "allow_force_pushes": {"enabled": False},
              "allow_deletions": {"enabled": False},
          }
          p.validate_applied_protection(applied)
          PY
          PYTHONPATH=scripts/release python - <<'PY'
          import termios

          import finalize_release
          import terminal_smoke

          sample = "# Changelog\n\n## [1.4.0] - Unreleased\n\n### Maintainability\n\n- item\n"
          finalized = finalize_release.finalize_changelog_text(
              sample,
              "1.4.0",
              "2026-10-04",
          )
          assert "## [1.4.0] - 2026-10-04" in finalized
          assert "Unreleased" not in finalized

          for bad_version in ("0.9.0", "1.4.0-rc.1"):
              try:
                  finalize_release.finalize_changelog_text(
                      sample,
                      bad_version,
                      "2026-10-03",
                  )
              except SystemExit:
                  pass
              else:
                  raise AssertionError("expected non-stable release version to fail")

          try:
              finalize_release.finalize_changelog_text(
                  sample + "\n## [1.4.0] - 2026-10-03\n",
                  "1.4.0",
                  "2026-10-04",
              )
          except SystemExit:
              pass
          else:
              raise AssertionError("expected duplicate release heading to fail")

          restored = termios.ICANON | termios.ECHO | termios.ISIG
          terminal_smoke.validate_restored_lflag(restored)
          try:
              terminal_smoke.validate_restored_lflag(
                  termios.ICANON | termios.ISIG
              )
          except SystemExit:
              pass
          else:
              raise AssertionError("expected missing ECHO to fail")
          assert terminal_smoke.terminal_label(
              "/dev/pts/9",
              "manual-terminal-label",
          ) == "manual-terminal-label"
          PY
          PYTHONPATH=scripts/release python - <<'PY'
          import linux_qualify as q

          sha = "0123456789abcdef0123456789abcdef01234567"
          payload = {
              "workflow_runs": [
                  {
                      "id": 10,
                      "name": "ci",
                      "path": ".github/workflows/ci.yml",
                      "event": "push",
                      "status": "completed",
                      "conclusion": "failure",
                      "head_branch": "main",
                      "head_sha": sha,
                  },
                  {
                      "id": 11,
                      "name": "ci",
                      "path": ".github/workflows/ci.yml",
                      "event": "push",
                      "status": "completed",
                      "conclusion": "success",
                      "head_branch": "main",
                      "head_sha": sha,
                  },
                  {
                      "id": 12,
                      "name": "ci",
                      "path": ".github/workflows/ci.yml",
                      "event": "pull_request",
                      "status": "completed",
                      "conclusion": "success",
                      "head_branch": "main",
                      "head_sha": sha,
                  },
                  {
                      "id": 13,
                      "name": "ci",
                      "path": ".github/workflows/ci.yml",
                      "event": "push",
                      "status": "completed",
                      "conclusion": "success",
                      "head_branch": "main",
                      "head_sha": "1123456789abcdef0123456789abcdef01234567",
                  },
              ]
          }
          assert q.select_canonical_ci_run(payload, sha)["id"] == 11
          try:
              q.select_canonical_ci_run({"workflow_runs": []}, sha)
          except SystemExit:
              pass
          else:
              raise AssertionError("expected missing canonical CI to fail")
          PY
          PYTHONPATH=scripts/release python -c 'import linux_qualify as q; assert q.stable_version_allowed("1.0.0"); assert q.stable_version_allowed("1.1.0"); assert q.stable_version_allowed("2.3.4"); assert not q.stable_version_allowed("0.9.0"); assert not q.stable_version_allowed("1.1.0-rc.1"); assert not q.stable_version_allowed("01.1.0")'
      - name: Verify Python scripts parse
        run: python -c "import pathlib, py_compile; [py_compile.compile(str(p), doraise=True) for p in pathlib.Path('scripts').rglob('*.py')]"
      - name: Enforce v1.3 stable-predecessor module ratchet
        run: python scripts/architecture/check_module_ratchet.py release/v1.3-plan.json
      - name: Enforce v1.4 active module ratchet
        run: python scripts/architecture/check_module_ratchet.py release/v1.4-plan.json
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - name: Test ABI policy
        run: python -m unittest discover -s scripts/release -p "test_*.py"
      - name: Smoke strong GLIBC imports on the baseline build
        if: runner.os == 'Linux'
        run: python scripts/release/check_linux_abi.py --binary target/debug/codex-tui --commit "${{ github.sha }}" --output linux-abi.json
