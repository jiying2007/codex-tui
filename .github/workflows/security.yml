name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  rustsec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-audit
      - run: cargo audit

  security-gate:
    name: security-gate
    if: ${{ always() }}
    needs: [cargo-deny, rustsec]
    runs-on: ubuntu-24.04
    steps:
      - name: Require both dependency security checks
        env:
          CARGO_DENY_RESULT: ${{ needs.cargo-deny.result }}
          RUSTSEC_RESULT: ${{ needs.rustsec.result }}
        run: |
          echo "cargo-deny=$CARGO_DENY_RESULT rustsec=$RUSTSEC_RESULT"
          test "$CARGO_DENY_RESULT" = success
          test "$RUSTSEC_RESULT" = success
