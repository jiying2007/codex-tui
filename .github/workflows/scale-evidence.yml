name: scale-evidence

on:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/release/validate_diagnostics.py"
      - ".github/workflows/scale-evidence.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/release/validate_diagnostics.py"
      - ".github/workflows/scale-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

# Only superseded PR heads are disposable. Exact main-SHA evidence is retained.
concurrency:
  group: scale-evidence-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-scale-evidence:
    runs-on: ubuntu-24.04
    env:
      CODEX_TUI_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build locked release binary
        run: cargo build --locked --release
      - name: Capture 10k and 50k Registry evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scale-evidence
          for ROWS in 10000 50000; do
            /usr/bin/time -v -o "scale-evidence/rss-${ROWS}.txt" \
              ./target/release/codex-tui release scale \
              --rows "${ROWS}" \
              --warmup 5 \
              --iterations 50 \
              --source "github-actions:ubuntu-24.04" \
              --json > "scale-evidence/report-${ROWS}.json"

            python3 scripts/release/validate_diagnostics.py scale "scale-evidence/report-${ROWS}.json" --commit "$GITHUB_SHA" --rows "$ROWS"

            echo "=== scale evidence ${ROWS} rows ==="
            cat "scale-evidence/report-${ROWS}.json"
            grep "Maximum resident set size" "scale-evidence/rss-${ROWS}.txt"
          done
      - name: Upload retained scale evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scale-evidence-${{ github.sha }}
          path: scale-evidence/
          if-no-files-found: error
          retention-days: 30
