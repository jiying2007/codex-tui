name: performance-diagnostics

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/performance-diagnostics.yml"
      - "src/release_benchmark.rs"
      - "src/render_performance.rs"
      - "src/interaction_performance.rs"
      - "src/app/**"
      - "src/runtime_store_worker.rs"
      - "src/main.rs"
      - "src/app.rs"
      - "src/planning.rs"
      - "src/conversation.rs"
      - "src/ui.rs"
      - "src/ui/thread.rs"
      - "src/backend.rs"
      - "src/compat.rs"
      - "release/v1.4-criteria.json"
      - "release/v1.4-completion.json"
      - "release/v1.4-plan.json"
      - "scripts/release/**"
      - "src/ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retained-performance:
    name: resident-planning-10k
    runs-on: ubuntu-24.04
    env:
      CODEX_TUI_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build exact source
        run: cargo build --locked --release --bin codex-tui

      - name: Capture retained 200-sample diagnostic
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/codex-tui release benchmark \
            --warmup 20 \
            --iterations 200 \
            --source "github-hosted:ubuntu-24.04" \
            --json | tee performance-diagnostics.json

      - name: Capture 10k Board and Thread render diagnostics
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/codex-tui release render-benchmark \
            --warmup 20 \
            --iterations 200 \
            --source "github-hosted:ubuntu-24.04" \
            --json | tee user-perceived-performance.json

      - name: Capture changed-state and planning phase diagnostics
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/codex-tui release interaction-benchmark \
            --warmup 20 --iterations 200 --source "github-hosted:ubuntu-24.04" \
            --json | tee interaction-performance.json
      - name: Validate exact-SHA diagnostic coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/validate_diagnostics.py performance performance-diagnostics.json --commit "$GITHUB_SHA"
          python3 scripts/release/validate_diagnostics.py render user-perceived-performance.json --commit "$GITHUB_SHA"
          python3 scripts/release/validate_diagnostics.py interaction interaction-performance.json --commit "$GITHUB_SHA"

      - uses: actions/upload-artifact@v7
        with:
          name: performance-diagnostics-${{ github.sha }}
          path: performance-diagnostics.json
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v7
        with:
          name: user-perceived-performance-${{ github.sha }}
          path: user-perceived-performance.json
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v7
        with:
          name: interaction-performance-${{ github.sha }}
          path: interaction-performance.json
          if-no-files-found: error
          retention-days: 90
