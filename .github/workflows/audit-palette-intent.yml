name: audit-palette-intent
on:
  pull_request:
    paths:
      - '.audit/**'
      - '.github/workflows/audit-palette-intent.yml'
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/v1.4-palette-intent'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Reproduce original Enter-handler failures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p "$RUNNER_TEMP/palette-evidence"
          python3 .audit/apply_palette.py tests
          cargo fmt --all
          set +e
          cargo test --locked --bin codex-tui runtime_palette::intent_tests -- --nocapture > "$RUNNER_TEMP/palette-evidence/before.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/palette-evidence/before.log"
          test "$code" = 101
          grep -q 'test result: FAILED' "$RUNNER_TEMP/palette-evidence/before.log"
          grep -q 'pin_does_not_follow_a_different_registry_row ... FAILED' "$RUNNER_TEMP/palette-evidence/before.log"
          grep -q 'unchanged_target_pin_executes_once ... ok' "$RUNNER_TEMP/palette-evidence/before.log"
      - name: Apply correction and remove temporary files
        run: |
          python3 .audit/apply_palette.py fix
          cargo fmt --all
          git add -A
          git diff --cached --check
      - name: Validate corrected full source and original governance
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/palette-evidence/clippy.log"
          cargo test --locked --all-targets --all-features 2>&1 | tee "$RUNNER_TEMP/palette-evidence/after.log"
          python3 -m unittest discover -s scripts/release -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/palette-evidence/python.log"
          python3 scripts/architecture/check_module_ratchet.py release/v1.3-plan.json
          python3 scripts/architecture/check_module_ratchet.py release/v1.4-plan.json
          python3 scripts/release/validate_v1_4_plan.py
          python3 scripts/release/validate_v1_4_completion.py
          git diff --cached --check
      - name: Export exact tested Git blobs without updating refs
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          changes=subprocess.check_output(['git','diff','--cached','--no-renames','--name-status','-z']).decode().split('\0')
          entries=[]
          for i in range(0,len(changes)-1,2):
              status,name=changes[i:i+2]
              entry={'path':name,'mode':'100644','type':'blob','sha':None}
              if status!='D':
                  raw=pathlib.Path(name).read_bytes()
                  result=subprocess.run(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs','--input','-'],input=json.dumps({'encoding':'utf-8','content':raw.decode()}),text=True,capture_output=True,check=True)
                  entry['sha']=json.loads(result.stdout)['sha']
                  assert entry['sha']==hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              entries.append(entry)
          receipt={'parent':os.environ['EXPECTED_HEAD'],'baseline':'89385fe39db4fc93826778e0c6ae2780c877c59f','tree':subprocess.check_output(['git','write-tree'],text=True).strip(),'entries':entries,'refUpdated':False}
          pathlib.Path(os.environ['RUNNER_TEMP'],'palette-evidence','candidate.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('CANDIDATE_RECEIPT='+json.dumps(receipt),flush=True)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: palette-intent-evidence
          path: ${{ runner.temp }}/palette-evidence/
          if-no-files-found: error
          retention-days: 30
