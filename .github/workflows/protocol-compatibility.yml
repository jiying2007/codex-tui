name: protocol-compatibility

on:
  push:
    branches: [main]
    paths:
      - "src/app_server.rs"
      - "src/app_server/**"
      - "src/app_server_*"
      - "src/codex_protocol.rs"
      - "src/compat.rs"
      - "src/conversation.rs"
      - "src/conversation/**"
      - "src/replay_backend.rs"
      - "src/domain.rs"
      - "src/thread_queue.rs"
      - "src/app/queue_*.rs"
      - "src/user_response.rs"
      - "src/app/user_*.rs"
      - "src/runtime_connection.rs"
      - "src/runtime_user_response.rs"
      - "src/runtime_user_response/**"
      - "tests/protocol_replay.rs"
      - "tests/fixtures/protocol/**"
      - "scripts/release/test_protocol_compatibility_trigger_scope.py"
      - "scripts/release/upstream_codex_release_watch.py"
      - "scripts/release/test_upstream_codex_release_watch.py"
      - ".github/workflows/protocol-compatibility.yml"
  pull_request:
    paths:
      - "src/app_server.rs"
      - "src/app_server/**"
      - "src/app_server_*"
      - "src/codex_protocol.rs"
      - "src/compat.rs"
      - "src/conversation.rs"
      - "src/conversation/**"
      - "src/replay_backend.rs"
      - "src/domain.rs"
      - "src/thread_queue.rs"
      - "src/app/queue_*.rs"
      - "src/user_response.rs"
      - "src/app/user_*.rs"
      - "src/runtime_connection.rs"
      - "src/runtime_user_response.rs"
      - "src/runtime_user_response/**"
      - "tests/protocol_replay.rs"
      - "tests/fixtures/protocol/**"
      - "scripts/release/test_protocol_compatibility_trigger_scope.py"
      - "scripts/release/upstream_codex_release_watch.py"
      - "scripts/release/test_upstream_codex_release_watch.py"
      - ".github/workflows/protocol-compatibility.yml"
  schedule:
    - cron: "41 2 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-compatibility-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify protocol event-adapter trigger coverage
        run: python3 -m unittest discover -s scripts/release -p 'test_protocol_compatibility_trigger_scope.py'
      - name: Guard pinned upstream observation (offline Python 3.8)
        run: |
          python3 -m unittest discover -s scripts/release -p 'test_upstream_codex_release_watch.py'
          python3 -O -m unittest discover -s scripts/release -p 'test_upstream_codex_release_watch.py'
      - name: Validate retained protocol fixture manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib

          manifest = json.load(open("tests/fixtures/protocol/manifest.json", encoding="utf-8"))
          assert manifest["schema"] == "codex-tui/protocol-fixtures/v1"
          assert len(manifest["fixtures"]) >= 4
          for fixture in manifest["fixtures"]:
              path = pathlib.Path(fixture["path"])
              assert path.is_file(), path
              assert path.stat().st_size > 0, path
          PY
      - name: Replay App Server protocol fixtures (L1)
        run: cargo test --locked --test protocol_replay
      - name: Exercise mock transport and registry lifecycle (L2)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib app_server_transport::tests::
          cargo test --locked --lib app_server::tests::

      - name: Observe official Codex stable release drift (advisory only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p upstream-release-watch
          if gh api 'repos/openai/codex/releases?per_page=100' > upstream-release-watch/releases.json; then
            python3 scripts/release/upstream_codex_release_watch.py \
              --manifest tests/fixtures/protocol/manifest.json \
              --releases upstream-release-watch/releases.json \
              --output upstream-release-watch/receipt.json
          else
            printf '%s\n' '{"schema":"codex-tui/upstream-codex-stable-watch/v1","status":"unverified-api-error","stableQualified":false,"l3Qualified":false,"authority":"public-release-metadata-only"}' > upstream-release-watch/receipt.json
            echo "::warning::Cannot observe official Codex stable releases; no L3 conclusion."
          fi
          rm -f upstream-release-watch/releases.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          name: upstream-codex-stable-watch
          path: upstream-release-watch/receipt.json
          if-no-files-found: warn
          retention-days: 30
