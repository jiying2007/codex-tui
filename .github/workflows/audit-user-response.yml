name: audit-user-response
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/v1.4-user-response-delivery'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify baseline and reproduce actual response loss
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code 380b81e950674fb88a064789d9bc4aa8b3c23323 -- src tests Cargo.toml Cargo.lock
          mkdir -p "$RUNNER_TEMP/response-evidence"
          python3 .audit/response_fix.py tests
          cargo fmt --all
          set +e
          cargo test --locked --test user_response_retention > "$RUNNER_TEMP/response-evidence/before.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/response-evidence/before.log"
          test "$code" = 101
          grep -q '1 passed; 4 failed' "$RUNNER_TEMP/response-evidence/before.log"
      - name: Apply correction and fail closed on ambiguous transport state
        shell: bash
        run: |
          set -euo pipefail
          python3 .audit/response_fix.py fix
          python3 - <<'PY'
          from pathlib import Path
          import json
          def replace(name, old, new):
              p=Path(name); s=p.read_text(); assert s.count(old)==1,(name,old[:80],s.count(old)); p.write_text(s.replace(old,new))
          replace('src/user_response.rs','use crate::conversation::{InteractiveRequest, RpcRequestId};','use crate::conversation::InteractiveRequest;')
          replace('src/user_response.rs','pub type UserResponseId = RpcRequestId;\n','')
          replace('src/app/user_response.rs', '        match outcome {', '''        // A delayed duplicate refusal cannot turn an uncertain attempt into a safe retry.
                  if attempt.unknown && matches!(outcome, UserResponseOutcome::NotSent(_)) {
                      self.user_responses.attempts.insert(id, attempt);
                      return;
                  }
                  match outcome {''')
          replace('src/app_server.rs', '''                        let outcome = user_response::send(&mut rpc, &mut pending_requests, &threads, submission).await;
                                  send_conversation_event(&conversation_tx, ConversationEvent::UserResponse { ticket, outcome }).await;'''.replace('                                  ','                        '), '''                        let outcome = user_response::send(&mut rpc, &mut pending_requests, &threads, submission).await;
                                  let unknown = matches!(&outcome, crate::user_response::UserResponseOutcome::Unknown(_));
                                  send_conversation_event(&conversation_tx, ConversationEvent::UserResponse { ticket, outcome }).await;
                                  if unknown {
                                      status.connected = false;
                                      status.error = Some("interactive response transport failed; delivery unconfirmed; connection stopped".into());
                                      generation = generation.saturating_add(1);
                                      let _ = tx.send(snapshot(generation, &threads, &status));
                                      return;
                                  }'''.replace('                                  ','                        '))
          replace('src/app_server/user_response.rs', '    send_with(pending, threads, submission, RPC_REQUEST_TIMEOUT,', '''    if queued_invalidates(&rpc.queued_messages, &submission) {
                  return UserResponseOutcome::NotSent("newer request or thread event awaits processing; answer retained".into());
              }
              send_with(pending, threads, submission, RPC_REQUEST_TIMEOUT,''')
          replace('src/app_server/user_response.rs','#[cfg(test)]\nmod tests;', '''fn queued_invalidates(queue: &VecDeque<Value>, submission: &UserResponseSubmission) -> bool {
              let id = submission.request.request_id.to_value();
              queue.iter().any(|message| {
                  let method = message.get("method").and_then(Value::as_str);
                  (method.is_some() && message.get("id") == Some(&id))
                      || (method == Some("serverRequest/resolved")
                          && message.pointer("/params/requestId") == Some(&id))
                      || (matches!(method, Some("thread/archived" | "thread/deleted" | "thread/unarchived"))
                          && message.pointer("/params/threadId").and_then(Value::as_str)
                              == Some(submission.request.thread_id.0.as_str()))
              })
          }
          #[cfg(test)]
          mod tests;''')
          with Path('src/app_server/user_response/tests.rs').open('a') as f:
              f.write('''
          #[test]
          fn queued_replacements_resolutions_and_removed_threads_invalidate_response() {
              let (_, _, s) = fixture();
              for message in [
                  json!({"id":"form", "method":"item/tool/requestUserInput", "params":{}}),
                  json!({"method":"serverRequest/resolved", "params":{"requestId":"form"}}),
                  json!({"method":"thread/deleted", "params":{"threadId":s.request.thread_id.0}}),
              ] { assert!(queued_invalidates(&VecDeque::from([message]), &s)); }
              assert!(!queued_invalidates(&VecDeque::from([json!({"method":"serverRequest/resolved", "params":{"requestId":"other"}})]), &s));
          }
          #[test]
          fn production_actor_stops_after_unknown_write_instead_of_reusing_partial_stream() {
              let source=include_str!("../../app_server.rs");
              let route=source.split("BackendCommand::SubmitUserInput(submission) => {").nth(1).unwrap().split("BackendCommand::LoadConversation").next().unwrap();
              assert!(route.contains("if unknown"));
              assert!(route.contains("status.connected = false"));
              assert!(route.contains("return;"));
          }
          ''')
          with Path('src/runtime_user_response/tests.rs').open('a') as f:
              f.write('''
          #[test]
          fn duplicate_refusal_cannot_clear_an_uncertain_attempt() {
              let (mut app,id,answers)=ready();
              let ticket=app.user_response_submission(&id,&answers).unwrap().ticket;
              app.finish_user_response(ticket,UserResponseOutcome::Unknown("partial write".into()));
              app.finish_user_response(ticket,UserResponseOutcome::NotSent("duplicate command".into()));
              assert!(reduce(&mut app,Action::CommitInput).is_empty());
              assert_eq!(app.input_buffer,"answer");
          }
          ''')
          with Path('src/app/user_response.rs').open('a') as f:
              f.write('''
          #[cfg(test)]
          mod tests {
              use super::*;
              use crate::{backend::{CodexBackend, FakeBackend}, conversation::{InteractiveRequest, InteractiveRequestKind, UserInputQuestion}, app::View};
              fn editor() -> AppState {
                  let mut app=AppState::new(FakeBackend::seeded().snapshot().threads);
                  let request=InteractiveRequest {request_id:RpcRequestId::String("r".into()),thread_id:app.threads[0].id.clone(),turn_id:"t".into(),item_id:"i".into(),kind:InteractiveRequestKind::UserInput {questions:vec![UserInputQuestion{id:"q".into(),header:"H".into(),question:"Q".into(),is_secret:false,options:vec![]}]}};
                  app.view=View::Thread(request.thread_id.clone());
                  crate::app::reduce(&mut app,Action::InteractiveRequested(request));
                  crate::app::reduce(&mut app,Action::BeginUserInput);
                  crate::app::reduce(&mut app,Action::InputText("retained".into()));
                  app
              }
              #[test]
              fn ticket_exhaustion_does_not_wrap_or_drop_answer() {
                  let mut app=editor(); app.user_responses.next_ticket=u64::MAX;
                  assert!(crate::app::reduce(&mut app,Action::CommitInput).is_empty());
                  assert_eq!(app.input_buffer,"retained");
                  assert!(app.user_responses.attempts.is_empty());
              }
              #[test]
              fn ledger_capacity_never_evicts_uncertain_entries() {
                  let mut app=editor(); crate::app::reduce(&mut app,Action::CommitInput);
                  let mut attempt=app.user_responses.attempts.values().next().unwrap().clone();
                  attempt.unknown=true; app.user_responses.attempts.clear();
                  for i in 0..LIMIT {app.user_responses.attempts.insert(RpcRequestId::String(format!("uncertain-{i}")),attempt.clone());}
                  assert!(crate::app::reduce(&mut app,Action::CommitInput).is_empty());
                  assert_eq!(app.user_responses.attempts.len(),LIMIT);
                  assert_eq!(app.input_buffer,"retained");
              }
          }
          ''')
          p=Path('docs/implementation/v1.4-user-response-delivery.md')
          p.write_text(p.read_text()+'''\nUncertain writes stop the connection rather than reuse a potentially partial stream.\nAlready queued form/resolution/thread-removal events are checked before writing.\nLate duplicate refusal cannot downgrade an uncertain outcome. Capacity and ticket\nexhaustion refuse without eviction, wraparound, lost input or automatic retries.\n''')
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/response-evidence/clippy.log"
          cargo test --locked --all-targets --all-features 2>&1 | tee "$RUNNER_TEMP/response-evidence/after.log"
          python3 -m unittest discover -s scripts/release -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/response-evidence/python.log"
          python3 scripts/architecture/check_module_ratchet.py release/v1.3-plan.json
          python3 scripts/architecture/check_module_ratchet.py release/v1.4-plan.json
          python3 scripts/release/validate_v1_4_plan.py
          python3 scripts/release/validate_v1_4_completion.py
          git add -A
          git diff --cached --check
      - name: Export tested UTF-8 source data only
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'],'response-source'); root.mkdir()
          changes=subprocess.check_output(['git','diff','--cached','--name-status','--no-renames','-z']).decode().split('\0')
          files=[]
          for i in range(0,len(changes)-1,2):
              status,name=changes[i:i+2]
              if status=='D': continue
              raw=pathlib.Path(name).read_bytes(); raw.decode('utf-8')
              data=str(len(files))+'.txt'; (root/data).write_bytes(raw)
              files.append({'path':name,'data':data,'sha256':hashlib.sha256(raw).hexdigest(),'gitSha':hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()})
          manifest={'parent':os.environ['EXPECTED_HEAD'],'base':'380b81e950674fb88a064789d9bc4aa8b3c23323','tree':subprocess.check_output(['git','write-tree'],text=True).strip(),'files':files}
          for dest in [root,pathlib.Path(os.environ['RUNNER_TEMP'],'response-evidence')]:
              (dest/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          pathlib.Path(os.environ['RUNNER_TEMP'],'response-evidence','validated.patch').write_bytes(subprocess.check_output(['git','diff','--cached']))
          print(json.dumps(manifest))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: response-verified-source
          path: ${{ runner.temp }}/response-source/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: response-evidence
          path: ${{ runner.temp }}/response-evidence/
          if-no-files-found: error
          retention-days: 30
  objects:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: response-verified-source
          path: data
      - name: Store verified source bytes without executing them or updating refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          allowed={'src/lib.rs','src/user_response.rs','src/app.rs','src/app/user_input.rs','src/app/user_response.rs','src/app_server.rs','src/app_server/user_response.rs','src/app_server/user_response/tests.rs','src/main.rs','src/runtime_user_response.rs','src/runtime_user_response/tests.rs','tests/user_input_intent.rs','tests/user_response_retention.rs','release/v1.4-plan.json','docs/implementation/v1.4-user-response-delivery.md'}
          root=pathlib.Path('data'); m=json.loads((root/'manifest.json').read_text())
          assert m['base']=='380b81e950674fb88a064789d9bc4aa8b3c23323'
          assert os.environ['GITHUB_REPOSITORY']=='jiying2007/codex-tui'
          assert {f['path'] for f in m['files']}==allowed
          entries=[]
          for i,f in enumerate(m['files']):
              assert f['data']==str(i)+'.txt'
              raw=(root/f['data']).read_bytes()
              assert len(raw)<500000 and hashlib.sha256(raw).hexdigest()==f['sha256']
              sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              assert sha==f['gitSha']
              p=subprocess.run(['gh','api','repos/jiying2007/codex-tui/git/blobs','--input','-'],input=json.dumps({'encoding':'utf-8','content':raw.decode('utf-8')}),text=True,capture_output=True,check=True)
              assert json.loads(p.stdout)['sha']==sha
              entries.append({'path':f['path'],'mode':'100644','type':'blob','sha':sha})
          receipt={'parent':m['parent'],'tree':m['tree'],'entries':entries,'refUpdated':False}
          pathlib.Path('receipt').mkdir(); pathlib.Path('receipt/candidate.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('CANDIDATE_RECEIPT='+json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: response-candidate-blobs
          path: receipt/
          retention-days: 30
