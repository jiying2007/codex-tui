name: audit-workbench
on:
  push:
    branches: [fix/deep-audit-20261011]
permissions:
  contents: read
concurrency:
  group: audit-workbench-isolated
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'jiying2007/codex-tui' && github.ref == 'refs/heads/fix/deep-audit-20261011'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Verify and apply exact reviewed source delta
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/audit-evidence
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          expected = '1656a17daafd586c614d0d82f4fa777b3b7390c214491b3c6bc5d98de032a0a7'
          patch = b''.join(Path('.audit-raw-' + str(i)).read_bytes() for i in range(8))
          for i in range(8):
              data = Path('.audit-raw-' + str(i)).read_bytes()
              print(i, len(data), hashlib.sha256(data).hexdigest())
          actual = hashlib.sha256(patch).hexdigest()
          print('patch SHA256:', actual)
          if actual != expected:
              raise SystemExit('patch transport mismatch; no code executed')
          marker = Path('.audit-applied')
          if not marker.exists():
              subprocess.run(['git', 'diff', '--exit-code', 'd1e4f8aadb2e1275e9e55ad51c8f7e50e6acd797', '--', 'src', 'tests', 'scripts', 'docs', 'release', 'CHANGELOG.md'], check=True)
              Path('/tmp/audit-evidence/reviewed.patch').write_bytes(patch)
              subprocess.run(['git', 'apply', '--check', '--unidiff-zero', '/tmp/audit-evidence/reviewed.patch'], check=True)
              subprocess.run(['git', 'apply', '--unidiff-zero', '/tmp/audit-evidence/reviewed.patch'], check=True)
              marker.write_text(expected + '\n')
          elif marker.read_text().strip() != expected:
              raise SystemExit('different prior repair payload')
          PY
          if test -f .audit-followup.py; then python3 .audit-followup.py; fi
          cargo fmt --all
          python3 - <<'PY'
          from pathlib import Path
          import json
          path = Path('release/v1.4-plan.json')
          plan = json.loads(path.read_text())
          review = plan['ratchetReviews'][-1]
          if review['date'] != '2026-10-11' or 'F1-F5' not in review['scope']:
              raise SystemExit('missing explicit defect-maintenance ceiling review')
          for module in review['modules']:
              plan['moduleRatchet'][module] = len(Path(module).read_text().splitlines())
          path.write_text(json.dumps(plan, indent=2) + '\n')
          PY
          python3 scripts/docs/check_docs.py
          python3 scripts/architecture/check_module_ratchet.py release/v1.4-plan.json
          python3 scripts/architecture/check_upstream_convergence.py
          python3 scripts/architecture/check_first_deployment.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs release CHANGELOG.md scripts/testing/app_server_transport_regression.py .audit-applied .audit-followup-applied
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            git commit -m 'fix(audit): close transport pagination approval and PTY lifetime defects'
            git push origin HEAD:refs/heads/fix/deep-audit-20261011
          fi
          echo "CODEX_TUI_GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CODEX_TUI_PTY_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CODEX_TUI_PTY_EVIDENCE_DIR=/tmp/audit-evidence/terminal" >> "$GITHUB_ENV"
          git rev-parse HEAD > /tmp/audit-evidence/source-sha.txt
      - name: Strict all-target Clippy
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/audit-evidence/clippy.log
      - name: Full all-target test suite and actual-binary regressions
        if: always() && steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --all-targets --all-features -- --nocapture 2>&1 | tee /tmp/audit-evidence/tests.log
      - name: Retain exact prepared source and binary when built
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/audit-evidence
          git archive --format=tar HEAD | gzip -n > /tmp/audit-evidence/prepared-source.tar.gz
          git diff --binary > /tmp/audit-evidence/uncommitted.patch
          if test -f target/debug/codex-tui; then
            cp target/debug/codex-tui /tmp/audit-evidence/codex-tui-debug
            sha256sum target/debug/codex-tui > /tmp/audit-evidence/debug-binary.sha256
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: audit-verification-${{ github.run_id }}
          path: /tmp/audit-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
