name: audit-workbench

on:
  pull_request:
    paths:
      - .github/workflows/audit-workbench.yml
      - .audit/**
permissions:
  contents: read
jobs:
  candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/v1.4-audit-closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Materialize the already-tested checksum-bound candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import hashlib, lzma, pathlib, shutil, subprocess
          parts = sorted(pathlib.Path('.audit').glob('remediation.xz.part*'))
          assert len(parts) == 5
          patch = lzma.decompress(b''.join(p.read_bytes() for p in parts))
          assert hashlib.sha256(patch).hexdigest() == '94e6018a795790d3cf3413642c9f3acd3972f2473971bcc9da34d5644c63d4dd'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          shutil.rmtree('.audit')
          pathlib.Path('.github/workflows/audit-workbench.yml').unlink()
          PY
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = 79620d80e8d52bc76b9c03d3a33861db7a628bdb
      - name: Retain branch plan and pathless Git blobs without ref changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit-candidate"
          python3 scripts/repository/branch_hygiene.py --repo "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/audit-candidate/branch-plan.json"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          entries=[]
          changes=subprocess.check_output(['git','diff','--cached','--no-renames','--name-status','-z']).decode().split('\0')
          for i in range(0,len(changes)-1,2):
              status,name=changes[i:i+2]
              entry={'path':name,'mode':'100644','type':'blob','sha':None}
              if status!='D':
                  raw=pathlib.Path(name).read_bytes()
                  body={'encoding':'utf-8','content':raw.decode('utf-8')}
                  proc=subprocess.run(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs','--input','-'],input=json.dumps(body),text=True,capture_output=True)
                  if proc.returncode:
                      raise SystemExit(proc.stderr+'\n'+proc.stdout)
                  entry['sha']=json.loads(proc.stdout)['sha']
                  expected=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
                  assert entry['sha']==expected
              entries.append(entry)
          receipt={'parent':os.environ['EXPECTED_HEAD'],'tree':'79620d80e8d52bc76b9c03d3a33861db7a628bdb','entries':entries,'refUpdated':False,'testedRun':37224646752}
          pathlib.Path(os.environ['RUNNER_TEMP'],'audit-candidate','candidate-blobs.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: audit-candidate
          path: ${{ runner.temp }}/audit-candidate/
          if-no-files-found: warn
          retention-days: 7
