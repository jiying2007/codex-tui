name: audit-335-worktree-control

on:
  push:
    branches: [fix/worktree-prewrite-identity-20261013]
    paths: [.github/workflows/audit-335-worktree-control.yml]

permissions:
  contents: read

jobs:
  integrate:
    if: >-
      github.repository == 'jiying2007/codex-tui' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/fix/worktree-prewrite-identity-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Merge the reviewed main, preserve both audit entries, and format the integration fixture
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(['git', *args], text=True)

          main = '326f082be766c77b0b8117ccf99c74f2749415fd'
          prior = '717128213e98fc990159a7ba9a36035703089932'
          base = 'fb32c097beb77778c6b7a6d64f7d6f0e783395b9'
          workflow = '.github/workflows/audit-335-worktree-control.yml'
          fixture = 'tests/worktree_prewrite_identity.rs'
          assert git('rev-parse', 'HEAD').strip() == os.environ['EXPECTED_HEAD']
          assert git('rev-parse', 'HEAD^').strip() == prior
          assert git('diff', '--name-only', prior, 'HEAD').strip() == workflow
          assert git('merge-base', main, 'HEAD').strip() == base
          assert git('rev-parse', 'HEAD:' + fixture).strip() == 'e1db0ebaf8dc8bfdae2e219a8d5c0ea11a438593'
          assert git('ls-remote', 'origin', 'refs/heads/main').split()[0] == main

          marker = '### Audit hardening\n\n'
          addition = ('- Revalidate Worktree Git common-dir after asynchronous admission checks and immediately before issuing a mutation; add a real-Git post-admission retarget negative control without claiming atomic same-user race immunity.\n\n\n')
          original = git('show', base + ':CHANGELOG.md')
          feature = git('show', 'HEAD:CHANGELOG.md')
          current = git('show', main + ':CHANGELOG.md')
          assert original.count(marker) == current.count(marker) == 1
          assert feature == original.replace(marker, marker + addition, 1)
          merged_changelog = current.replace(marker, marker + addition, 1)

          result = subprocess.run(['git', 'merge', '--no-commit', '--no-ff', main])
          assert result.returncode in (0, 1)
          conflicts = git('diff', '--name-only', '--diff-filter=U').splitlines()
          assert conflicts in ([], ['CHANGELOG.md']), conflicts
          if conflicts:
              Path('CHANGELOG.md').write_text(merged_changelog, encoding='utf-8')
              subprocess.run(['git', 'add', '--', 'CHANGELOG.md'], check=True)
          assert Path('CHANGELOG.md').read_text(encoding='utf-8') == merged_changelog
          assert git('rev-parse', 'MERGE_HEAD').strip() == main

          expected_fixture = Path(fixture).read_text(encoding='utf-8')
          replacements = [
              ('        git(&real_git, &repo, &["symbolic-ref", "HEAD", "refs/heads/main"]);',
               '        git(\n            &real_git,\n            &repo,\n            &["symbolic-ref", "HEAD", "refs/heads/main"],\n        );'),
              ('    assert!(root.join("admitted").is_file(), "admission was not exercised");',
               '    assert!(\n        root.join("admitted").is_file(),\n        "admission was not exercised"\n    );'),
              ('    assert!(has_victim(&real_git, &foreign), "foreign branch was modified");',
               '    assert!(\n        has_victim(&real_git, &foreign),\n        "foreign branch was modified"\n    );'),
              ('    assert_eq!(store.operation_receipt(&operation_id).unwrap(), Some(receipt));',
               '    assert_eq!(\n        store.operation_receipt(&operation_id).unwrap(),\n        Some(receipt)\n    );'),
          ]
          for old, new in replacements:
              assert expected_fixture.count(old) == 1, old
              expected_fixture = expected_fixture.replace(old, new, 1)
          subprocess.run(['rustfmt', '--edition', '2024', fixture], check=True)
          assert Path(fixture).read_text(encoding='utf-8') == expected_fixture, 'unexpected formatter changes'
          assert git('diff', '--name-only').strip() == fixture
          expected = {
              workflow, fixture, 'CHANGELOG.md', 'docs/guides/troubleshooting.md',
              'docs/zh-CN/guides/troubleshooting.md', 'release/v1.4-plan.json',
              'src/worktree.rs', 'src/worktree/tests.rs',
          }
          assert set(git('diff', '--name-only', main).splitlines()) == expected
          PY
          cargo fmt --all -- --check
          python3 scripts/architecture/check_module_ratchet.py release/v1.4-plan.json
          python3 scripts/docs/check_docs.py
          git diff --check
          git diff --cached --check
          test "$(git ls-remote origin refs/heads/fix/worktree-prewrite-identity-20261013 | cut -f1)" = "$EXPECTED_HEAD"
          git add -- tests/worktree_prewrite_identity.rs
          git commit -m 'fix(worktree): integrate validated watch ownership and format coordinator regressions'
          git push origin HEAD:refs/heads/fix/worktree-prewrite-identity-20261013
