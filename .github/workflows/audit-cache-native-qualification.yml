name: audit-cache-native-qualification
on:
  push:
    branches: [fix/cache-return-workload-20261013]
    paths: [.github/workflows/audit-cache-native-qualification.yml]
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'jiying2007/codex-tui' && github.ref == 'refs/heads/fix/cache-return-workload-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CODEX_TUI_GIT_SHA: 56097752d8de507a305f6dcec6ae4ebbf8a2decf
      CODEX_TUI_PTY_SOURCE_SHA: 56097752d8de507a305f6dcec6ae4ebbf8a2decf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 56097752d8de507a305f6dcec6ae4ebbf8a2decf
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build the exact clean candidate, not the temporary workflow tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CODEX_TUI_GIT_SHA"
          git diff --exit-code
          OUT="$RUNNER_TEMP/cache-native"
          mkdir -p "$OUT"
          cargo build --locked --release > "$OUT/build.log" 2>&1
          cp target/release/codex-tui "$OUT/codex-tui"
          git archive HEAD > "$OUT/source.tar"
          git rev-parse HEAD HEAD^{tree} > "$OUT/identity.txt"
          sha256sum "$OUT/codex-tui" "$OUT/source.tar" > "$OUT/SHA256SUMS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cache-native-${{ github.run_id }}
          path: ${{ runner.temp }}/cache-native
          if-no-files-found: error
          retention-days: 14
      - name: Exercise unchanged production cache and source-bound workload
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cache-native-results"
          mkdir -p "$OUT"
          python3 -O -m unittest discover -s scripts/testing -p 'test_terminal*.py' > "$OUT/selftests.log" 2>&1
          python3 -O scripts/testing/watch_cache_regression.py target/release/codex-tui "$OUT/cache" --duration-seconds 300 > "$OUT/cache.log" 2>&1
          python3 -O scripts/testing/watch_ownership_regression.py target/release/codex-tui "$OUT/watch" > "$OUT/watch.log" 2>&1
          python3 -O scripts/testing/watch_pressure_regression.py target/release/codex-tui "$OUT/pressure" > "$OUT/pressure.log" 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: cache-native-results-${{ github.run_id }}
          path: ${{ runner.temp }}/cache-native-results
          if-no-files-found: warn
          retention-days: 14
