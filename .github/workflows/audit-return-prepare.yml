name: audit-return-prepare
on:
  push:
    branches: [fix/provisional-search-return-20261013]
    paths: [.github/workflows/audit-return-prepare.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'jiying2007/codex-tui' && github.ref == 'refs/heads/fix/provisional-search-return-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Apply exact reviewed return patch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/return-prepared"
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess, urllib.request
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          base = 'fbe8f7c39995b4f823de56d533d14e8bf1164bc5'
          workflow = '.github/workflows/audit-return-prepare.yml'
          paths = [
              'CHANGELOG.md', 'docs/guides/troubleshooting.md', 'docs/zh-CN/guides/troubleshooting.md',
              'release/v1.4-plan.json', 'scripts/testing/test_terminal_watch_ownership.py',
              'scripts/testing/test_terminal_watch_return.py', 'scripts/testing/watch_ownership_regression.py',
              'scripts/testing/watch_return_regression.py', 'src/app/state.rs',
              'src/app/watch/tests.rs', 'tests/terminal_restoration.rs',
          ]
          assert git('rev-parse', 'HEAD') == os.environ['EXPECTED_HEAD']
          assert git('rev-parse', 'HEAD^') == base
          assert git('diff', '--name-only', base, 'HEAD') == workflow
          assert git('ls-remote', 'origin', 'refs/heads/main').split()[0] == base
          request = urllib.request.Request(
              'https://api.github.com/repos/jiying2007/codex-tui/git/blobs/1db30a2a25e8ab81735fb7ca83246208e5e7a763',
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=30) as response:
              blob=json.load(response)
          assert blob['sha']=='1db30a2a25e8ab81735fb7ca83246208e5e7a763'
          patch=lzma.decompress(base64.b64decode(blob['content']))
          assert len(patch)==14628
          assert hashlib.sha256(patch).hexdigest()=='d740ae062a729a3eb7550407e9c4f11704763438cd8de7ace4756bb24c28b86b'
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply'],input=patch,check=True)
          subprocess.run(['cargo','fmt','--all'],check=True)
          ledger_path=Path('release/v1.4-plan.json')
          ledger=json.loads(ledger_path.read_text(encoding='utf-8'))
          for path in ['src/app/state.rs','src/app/watch/tests.rs']:
              ledger['moduleRatchet'][path]=len(Path(path).read_text(encoding='utf-8').splitlines())
          ledger_path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          changed=set(git('diff','--name-only').splitlines())
          changed.update(git('ls-files','--others','--exclude-standard').splitlines())
          assert changed==set(paths),sorted(changed)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          cargo fmt --all -- --check
          python3 scripts/docs/check_docs.py
          python3 scripts/architecture/check_module_ratchet.py release/v1.4-plan.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git ls-remote origin refs/heads/fix/provisional-search-return-20261013 | cut -f1)" = "$EXPECTED_HEAD"
          git commit -m 'fix(app): preserve valid provisional thread return when cancelling search'
          git push origin HEAD:refs/heads/fix/provisional-search-return-20261013
          echo "CODEX_TUI_GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CODEX_TUI_PTY_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git archive HEAD > "$RUNNER_TEMP/return-prepared/source.tar"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/return-prepared/identity.txt"
      - name: Verify and exercise the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/return-prepared"
          python3 -O -m unittest discover -s scripts/testing -p 'test_terminal*.py' > "$OUT/observer-tests.log" 2>&1
          cargo clippy --locked --all-targets --all-features -- -D warnings > "$OUT/clippy.log" 2>&1
          CODEX_TUI_PTY_EVIDENCE_DIR="$OUT/debug-pty" cargo test --locked --all-targets --all-features > "$OUT/cargo-test.log" 2>&1
          cargo build --locked --release > "$OUT/build-release.log" 2>&1
          cp target/release/codex-tui "$OUT/codex-tui"
          sha256sum "$OUT/codex-tui" "$OUT/source.tar" > "$OUT/SHA256SUMS"
          python3 -O scripts/testing/watch_ownership_regression.py target/release/codex-tui "$OUT/optimized-watch" > "$OUT/optimized-watch.log" 2>&1
          python3 -O scripts/testing/watch_pressure_regression.py target/release/codex-tui "$OUT/optimized-pressure" > "$OUT/optimized-pressure.log" 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: return-prepared-${{ github.run_id }}
          path: ${{ runner.temp }}/return-prepared
          retention-days: 14
          if-no-files-found: error
