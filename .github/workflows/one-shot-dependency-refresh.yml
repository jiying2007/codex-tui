name: one-shot Rust dependency maintenance

on:
  push:
    branches:
      - fix/personal-workbench-hardening-20261118

permissions:
  contents: write

jobs:
  refresh-lock-and-format:
    if: startsWith(github.event.head_commit.message, 'maintenance: invoke cargo refresh')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
          components: rustfmt
      - name: Generate Cargo.lock and format changed sources
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p rusqlite --precise 0.41.0
          cargo update -p libsqlite3-sys --precise 0.39.1
          cargo fmt --all
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock src
          if ! git diff --cached --quiet; then
            git commit -m 'build: refresh secure SQLite lock and rustfmt'
            git push origin HEAD:refs/heads/fix/personal-workbench-hardening-20261118
          fi
