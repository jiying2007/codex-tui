name: audit-335-source-transfer

on:
  push:
    branches: [test/audit-335-program-qualification]
    paths: [.github/workflows/audit-335-source-transfer.yml]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'jiying2007/codex-tui' && github.ref == 'refs/heads/test/audit-335-program-qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Apply exact reviewed patch and commit only its allowlisted paths
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit-335-prepared"
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          base = '5ba11cc1a15f18e9eabb8a8dd301cb5a296abf79'
          prior = '9334ecec05635901f07fcaeb9af5eb9d1072e310'
          workflow = '.github/workflows/audit-335-source-transfer.yml'
          paths = [
              'CHANGELOG.md', 'docs/guides/troubleshooting.md',
              'docs/zh-CN/guides/troubleshooting.md', 'release/v1.4-plan.json',
              'scripts/testing/test_terminal_watch_ownership.py',
              'scripts/testing/watch_ownership_regression.py', 'src/app.rs',
              'src/app/prompt.rs', 'src/app/reducer.rs', 'src/app/watch.rs',
              'src/app/watch/tests.rs', 'src/main.rs', 'tests/terminal_restoration.rs',
          ]
          assert git('rev-parse', 'HEAD') == os.environ['EXPECTED_HEAD']
          assert git('rev-parse', 'HEAD^') == prior
          assert git('diff', '--name-only', base, 'HEAD') == workflow
          assert git('ls-remote', 'origin', 'refs/heads/main').split()[0] == base
          request = urllib.request.Request(
              'https://api.github.com/repos/jiying2007/codex-tui/git/blobs/0a765c8e80d8a8e33fcd48c4a5374c338e755d4c',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json'},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              blob = json.load(response)
          assert blob['sha'] == '0a765c8e80d8a8e33fcd48c4a5374c338e755d4c'
          patch = lzma.decompress(base64.b64decode(blob['content']))
          assert len(patch) == 41529
          assert hashlib.sha256(patch).hexdigest() == '8407686ef12dd670df04b15793e52a37eb03fe258092a16a605ab816586fd5a2'
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero'], input=patch, check=True)
          subprocess.run(['cargo', 'fmt', '--all'], check=True)
          ledger_path = Path('release/v1.4-plan.json')
          ledger = json.loads(ledger_path.read_text(encoding='utf-8'))
          for path in ['src/app.rs', 'src/app/prompt.rs', 'src/app/reducer.rs', 'src/main.rs', 'src/app/watch.rs', 'src/app/watch/tests.rs']:
              ledger['moduleRatchet'][path] = len(Path(path).read_text(encoding='utf-8').splitlines())
          ledger_path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          changed = set(git('diff', '--name-only').splitlines())
          changed.update(git('ls-files', '--others', '--exclude-standard').splitlines())
          assert changed == set(paths), sorted(changed)
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          assert set(git('diff', '--cached', '--name-only').splitlines()) == set(paths)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git ls-remote origin refs/heads/test/audit-335-program-qualification | cut -f1)" = "$EXPECTED_HEAD"
          git commit -m 'fix(app): deliver watch cleanup effects and retain reachable return targets'
          git push origin HEAD:refs/heads/test/audit-335-program-qualification
          echo "CODEX_TUI_GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CODEX_TUI_PTY_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git update-ref refs/heads/audit-prepared HEAD
          git bundle create "$RUNNER_TEMP/audit-335-prepared/source.bundle" refs/heads/audit-prepared
          git show --stat --oneline HEAD > "$RUNNER_TEMP/audit-335-prepared/commit.txt"
      - name: Verify complete source and regression suite
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/audit-335-prepared"
          cargo fmt --all -- --check
          python3 scripts/docs/check_docs.py
          python3 scripts/architecture/check_module_ratchet.py release/v1.4-plan.json
          python3 -O -m unittest discover -s scripts/testing -p 'test_terminal*.py' > "$OUT/observer-tests.log" 2>&1
          cargo clippy --locked --all-targets --all-features -- -D warnings > "$OUT/clippy.log" 2>&1
          cargo test --locked --all-targets --all-features > "$OUT/cargo-test.log" 2>&1
          cargo build --locked --release > "$OUT/build-release.log" 2>&1
          python3 -O scripts/testing/watch_ownership_regression.py \
            --binary target/release/codex-tui --output "$OUT/optimized-watch" \
            > "$OUT/optimized-watch.log" 2>&1
          cp target/release/codex-tui "$OUT/codex-tui"
          sha256sum "$OUT/codex-tui" "$OUT/source.bundle" > "$OUT/SHA256SUMS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: audit-335-prepared-${{ github.run_id }}
          path: ${{ runner.temp }}/audit-335-prepared
          retention-days: 14
          if-no-files-found: error
