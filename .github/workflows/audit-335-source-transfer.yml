name: audit-335-source-transfer

on:
  push:
    branches: [test/audit-335-program-qualification]
    paths: [.github/workflows/audit-335-source-transfer.yml]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'jiying2007/codex-tui' && github.ref == 'refs/heads/test/audit-335-program-qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Preserve provisional history ownership without resurrecting deleted subscriptions
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit-335-prepared"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              assert text.count(old) == count, (path, old, text.count(old))
              p.write_text(text.replace(old, new), encoding='utf-8')

          prior = 'f71ba6d09564517e7bd5c625bbf503bd41c8f1bb'
          workflow = '.github/workflows/audit-335-source-transfer.yml'
          paths = ['src/app.rs', 'src/app/state.rs', 'src/app/reducer.rs', 'src/app/watch.rs', 'src/app/watch/tests.rs', 'release/v1.4-plan.json']
          assert git('rev-parse', 'HEAD') == os.environ['EXPECTED_HEAD']
          assert git('rev-parse', 'HEAD^') == prior
          assert git('diff', '--name-only', prior, 'HEAD') == workflow
          replace('src/app.rs',
              '    watched_conversations: BTreeSet<String>,',
              '    watched_conversations: BTreeSet<String>,\n    unregistered_watches: BTreeSet<String>,')
          replace('src/app/state.rs',
              '            watched_conversations: BTreeSet::new(),',
              '            watched_conversations: BTreeSet::new(),\n            unregistered_watches: BTreeSet::new(),')
          replace('src/app/reducer.rs',
              '        Action::ConversationFailed { thread_id, error } => {\n            state.prompt_submissions.history_resolved(&thread_id);',
              '        Action::ConversationFailed { thread_id, error } => {\n            state.unregistered_watches.remove(&thread_id.0);\n            state.prompt_submissions.history_resolved(&thread_id);')
          replace('src/app/watch.rs',
              '    for effect in &effects {\n        match effect {',
              '    // Provisional owners are only unresolved watches, never tombstones.\n    state.unregistered_watches.retain(|id| {\n        state.watched_conversations.contains(id) && !state.thread_index_by_id.contains_key(id)\n    });\n    for effect in &effects {\n        match effect {')
          replace('src/app/watch.rs',
              '                state.watched_conversations.insert(id.0.clone());',
              '                track_watch(state, id);')
          replace('src/app/watch.rs',
              '                state.watched_conversations.insert(hit.thread_id.0.clone());',
              '                track_watch(state, &hit.thread_id);')
          replace('src/app/watch.rs',
              '.filter(|id| state.thread_index_by_id.contains_key(*id))',
              '.filter(|id| state.thread_index_by_id.contains_key(*id) || state.unregistered_watches.contains(*id))')
          replace('src/app/watch.rs',
              '        && state.thread_index_by_id.contains_key(&id.0)',
              '        && (state.thread_index_by_id.contains_key(&id.0) || state.unregistered_watches.contains(&id.0))')
          replace('src/app/watch.rs',
              '        && state.thread_index_by_id.contains_key(&previous.0)',
              '        && (state.thread_index_by_id.contains_key(&previous.0) || state.unregistered_watches.contains(&previous.0))')
          replace('src/app/watch.rs',
              '    effects\n}\n\n// Follow only return routes',
              '    state.unregistered_watches.retain(|id| state.watched_conversations.contains(id));\n    effects\n}\n\nfn track_watch(state: &mut AppState, id: &ThreadId) {\n    state.watched_conversations.insert(id.0.clone());\n    if !state.thread_index_by_id.contains_key(&id.0) {\n        state.unregistered_watches.insert(id.0.clone());\n    }\n}\n\n// Follow only return routes')
          replace('src/app/watch/tests.rs',
              '    reduce(&mut state, Action::QuickPrompt);',
              '    reduce(&mut state, Action::QuickPrompt);\n    reduce(&mut state, Action::ConversationLoaded(empty_page(id.clone())));', count=2)
          test = '''
          #[test]
          fn unregistered_history_can_resolve_but_deleted_or_failed_watches_are_released() {
              for resolves in [false, true] {
                  let mut state = idle_app();
                  reduce(&mut state, Action::Back);
                  let id = ThreadId::new("not-yet-in-registry");
                  state.view = View::Thread(id.clone());
                  let effects = reconcile(&mut state, vec![Effect::LoadConversation(id.clone())]);
                  assert_eq!(effects, vec![Effect::LoadConversation(id.clone())]);
                  let rows = state.threads.clone();
                  assert!(reduce(&mut state, Action::ReplaceThreads(rows)).is_empty());
                  let effects = if resolves {
                      let mut rows = state.threads.clone();
                      let mut registered = rows[0].clone();
                      registered.id = id.clone();
                      rows.push(registered);
                      assert!(reduce(&mut state, Action::ReplaceThreads(rows)).is_empty());
                      assert!(state.unregistered_watches.is_empty());
                      let rows = state.threads.iter().filter(|row| row.id != id).cloned().collect();
                      reduce(&mut state, Action::ReplaceThreads(rows))
                  } else {
                      reduce(&mut state, Action::ConversationFailed { thread_id: id.clone(), error: "missing".into() })
                  };
                  assert_eq!(effects, vec![Effect::StopWatchingConversation(id)]);
                  assert!(state.watched_conversations.is_empty());
                  assert!(state.unregistered_watches.is_empty());
              }
          }
          '''
          with Path('src/app/watch/tests.rs').open('a', encoding='utf-8') as f:
              f.write(test)
          subprocess.run(['cargo', 'fmt', '--all'], check=True)
          ledger_path = Path('release/v1.4-plan.json')
          ledger = json.loads(ledger_path.read_text(encoding='utf-8'))
          for path in paths[:-1]:
              ledger['moduleRatchet'][path] = len(Path(path).read_text(encoding='utf-8').splitlines())
          ledger_path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          assert set(git('diff', '--name-only').splitlines()) == set(paths)
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git ls-remote origin refs/heads/test/audit-335-program-qualification | cut -f1)" = "$EXPECTED_HEAD"
          git commit -m 'fix(app): distinguish provisional history targets from deleted watches'
          git push origin HEAD:refs/heads/test/audit-335-program-qualification
          echo "CODEX_TUI_GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CODEX_TUI_PTY_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git update-ref refs/heads/audit-prepared HEAD
          git bundle create "$RUNNER_TEMP/audit-335-prepared/source.bundle" refs/heads/audit-prepared
          git show --stat --oneline HEAD > "$RUNNER_TEMP/audit-335-prepared/commit.txt"
      - name: Verify complete source and regression suite
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/audit-335-prepared"
          cargo fmt --all -- --check
          python3 scripts/docs/check_docs.py
          python3 scripts/architecture/check_module_ratchet.py release/v1.4-plan.json
          python3 -O -m unittest discover -s scripts/testing -p 'test_terminal*.py' > "$OUT/observer-tests.log" 2>&1
          cargo clippy --locked --all-targets --all-features -- -D warnings > "$OUT/clippy.log" 2>&1
          cargo test --locked --all-targets --all-features > "$OUT/cargo-test.log" 2>&1
          cargo build --locked --release > "$OUT/build-release.log" 2>&1
          python3 -O scripts/testing/watch_ownership_regression.py \
            target/release/codex-tui "$OUT/optimized-watch" \
            > "$OUT/optimized-watch.log" 2>&1
          cp target/release/codex-tui "$OUT/codex-tui"
          sha256sum "$OUT/codex-tui" "$OUT/source.bundle" > "$OUT/SHA256SUMS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: audit-335-prepared-${{ github.run_id }}
          path: ${{ runner.temp }}/audit-335-prepared
          retention-days: 14
          if-no-files-found: error
