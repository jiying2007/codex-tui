name: audit-335-source-transfer

on:
  push:
    branches: [test/audit-335-program-qualification]
    paths: [.github/workflows/audit-335-source-transfer.yml]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'jiying2007/codex-tui' && github.ref == 'refs/heads/test/audit-335-program-qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Preserve nested failure effects with exact source guards
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit-335-prepared"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              assert text.count(old) == 1, (path, old)
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          prior = '0b92f16cb19b642e39b0d8cf6ba885b4521e7d37'
          workflow = '.github/workflows/audit-335-source-transfer.yml'
          paths = ['src/app/prompt.rs', 'src/app/reducer.rs', 'src/app/watch/tests.rs', 'release/v1.4-plan.json']
          assert git('rev-parse', 'HEAD') == os.environ['EXPECTED_HEAD']
          assert git('rev-parse', 'HEAD^') == prior
          assert git('diff', '--name-only', prior, 'HEAD') == workflow
          assert git('rev-parse', 'HEAD:src/app/prompt.rs') == 'fe6d1272e1a8633d9e16327249f14a0fff73d027'
          replace('src/app/prompt.rs',
              'pub(super) fn fail(state: &mut AppState, thread_id: ThreadId, request_id: u64, error: String) {',
              'pub(super) fn fail(state: &mut AppState, thread_id: ThreadId, request_id: u64, error: String) -> Vec<Effect> {')
          replace('src/app/prompt.rs',
              '        reduce(state, Action::ConversationFailed { thread_id, error });\n    }\n}',
              '        return reduce(state, Action::ConversationFailed { thread_id, error });\n    }\n    vec![]\n}')
          replace('src/app/reducer.rs',
              '            prompt::fail(state, thread_id, request_id, error);',
              '            return prompt::fail(state, thread_id, request_id, error);')
          test = '''
          #[test]
          fn failed_prompt_propagates_nested_watch_cleanup_without_replaying_the_send() {
              let mut state = idle_app();
              let id = state.current_thread_id().unwrap().clone();
              reduce(&mut state, Action::ConversationLoaded(empty_page(id.clone())));
              reduce(&mut state, Action::QuickPrompt);
              reduce(&mut state, Action::SetDraft("retain failed draft".into()));
              let effects = reduce(&mut state, Action::CommitInput);
              let [Effect::SubmitPrompt { request_id, .. }] = effects.as_slice() else {
                  panic!("submission expected");
              };
              reduce(&mut state, Action::Back);
              let effects = reduce(&mut state, Action::PromptFailed {
                  thread_id: id.clone(), request_id: *request_id, error: "fixture".into(),
              });
              assert_eq!(effects, vec![Effect::StopWatchingConversation(id.clone())]);
              assert!(state.watched_conversations.is_empty());
              assert_eq!(state.thread_ui[&id.0].draft, "retain failed draft");
          }
          '''
          with Path('src/app/watch/tests.rs').open('a', encoding='utf-8') as f:
              f.write(test)
          subprocess.run(['cargo', 'fmt', '--all'], check=True)
          ledger_path = Path('release/v1.4-plan.json')
          ledger = json.loads(ledger_path.read_text(encoding='utf-8'))
          for path in paths[:3]:
              ledger['moduleRatchet'][path] = len(Path(path).read_text(encoding='utf-8').splitlines())
          ledger_path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          assert set(git('diff', '--name-only').splitlines()) == set(paths)
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git ls-remote origin refs/heads/test/audit-335-program-qualification | cut -f1)" = "$EXPECTED_HEAD"
          git commit -m 'fix(app): propagate nested prompt failure cleanup effects'
          git push origin HEAD:refs/heads/test/audit-335-program-qualification
          echo "CODEX_TUI_GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CODEX_TUI_PTY_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git update-ref refs/heads/audit-prepared HEAD
          git bundle create "$RUNNER_TEMP/audit-335-prepared/source.bundle" refs/heads/audit-prepared
          git show --stat --oneline HEAD > "$RUNNER_TEMP/audit-335-prepared/commit.txt"
      - name: Verify complete source and regression suite
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/audit-335-prepared"
          cargo fmt --all -- --check
          python3 scripts/docs/check_docs.py
          python3 scripts/architecture/check_module_ratchet.py release/v1.4-plan.json
          python3 -O -m unittest discover -s scripts/testing -p 'test_terminal*.py' > "$OUT/observer-tests.log" 2>&1
          cargo clippy --locked --all-targets --all-features -- -D warnings > "$OUT/clippy.log" 2>&1
          cargo test --locked --all-targets --all-features > "$OUT/cargo-test.log" 2>&1
          cargo build --locked --release > "$OUT/build-release.log" 2>&1
          python3 -O scripts/testing/watch_ownership_regression.py \
            target/release/codex-tui "$OUT/optimized-watch" \
            > "$OUT/optimized-watch.log" 2>&1
          cp target/release/codex-tui "$OUT/codex-tui"
          sha256sum "$OUT/codex-tui" "$OUT/source.bundle" > "$OUT/SHA256SUMS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: audit-335-prepared-${{ github.run_id }}
          path: ${{ runner.temp }}/audit-335-prepared
          retention-days: 14
          if-no-files-found: error
