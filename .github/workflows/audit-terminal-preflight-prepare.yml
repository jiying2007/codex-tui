name: audit-terminal-preflight-prepare
on:
  push:
    branches: [fix/linux-terminal-evidence-preflight-20261014]
    paths: [.github/workflows/audit-terminal-preflight-prepare.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'jiying2007/codex-tui' && github.ref == 'refs/heads/fix/linux-terminal-evidence-preflight-20261014'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Move terminal validation before cargo metadata and protect the ordering
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/terminal-preflight"
          mkdir -p "$OUT"
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          prior = 'b9e89e1bd08a9a90c9c86e253149ba1cacb469d4'
          workflow = '.github/workflows/audit-terminal-preflight-prepare.yml'
          paths = ['scripts/release/linux_qualify.py', 'scripts/release/test_linux_qualify_terminal.py']
          assert git('rev-parse', 'HEAD') == os.environ['EXPECTED_HEAD']
          assert git('rev-parse', 'HEAD^') == prior
          assert git('diff', '--name-only', prior, 'HEAD') == workflow
          assert git('ls-remote', 'origin', 'refs/heads/main').split()[0] == '649ee949f304a5bc553220a3b7ad93af1bffc7f4'
          assert git('rev-parse', 'HEAD:'+paths[0]) == '133021b8f156df7ed1ef5845f39abe0da8f7f8c6'
          assert git('rev-parse', 'HEAD:'+paths[1]) == '8acad59bf84638f78406b05636f614ef153fb6c1'
          p = Path(paths[0]); text = p.read_text(encoding='utf-8')
          block = ('    # Reject absent, malformed or wrong-source real evidence before network,\n'
                   '    # compilation or benchmarks. Capture the accepted bytes for all later hashes.\n'
                   '    terminal_input = pathlib.Path(args.terminal_receipt).resolve()\n'
                   '    terminal, terminal_raw = read_terminal_receipt(terminal_input, commit_sha)\n'
                   '    terminal_sha256 = hashlib.sha256(terminal_raw).hexdigest()\n')
          marker = '    package = cargo_package(root)\n'
          assert text.count(block) == text.count(marker) == 1
          text = text.replace(block, '').replace(marker, block+'\n'+marker)
          p.write_text(text, encoding='utf-8')
          p = Path(paths[1]); text = p.read_text(encoding='utf-8')
          replacements = [
              ('        self.forbid_work = False\n',
               '        self.forbid_work = False\n        self.forbid_metadata = False\n        self.metadata_calls = 0\n'),
              ('    def invoke(self, dispatch=False):\n',
               '    def package_metadata(self, root):\n        self.metadata_calls += 1\n        if self.forbid_metadata:\n            raise AssertionError("cargo metadata ran before terminal rejection")\n        return {"version": "1.4.0", "license": "Apache-2.0"}\n\n    def invoke(self, dispatch=False):\n'),
              ('mock.patch.object(q, "cargo_package", return_value={"version": "1.4.0", "license": "Apache-2.0"})',
               'mock.patch.object(q, "cargo_package", side_effect=self.package_metadata)'),
              ('    def test_bad_receipts_stop_before_network_build_or_output_creation(self):\n        self.forbid_work = True\n',
               '    def test_bad_receipts_stop_before_network_build_or_output_creation(self):\n        self.forbid_work = True\n        self.forbid_metadata = True\n'),
              ('                self.assertFalse(self.output.exists())\n',
               '                self.assertFalse(self.output.exists())\n                self.assertEqual(self.metadata_calls, 0)\n'),
          ]
          for old, new in replacements:
              assert text.count(old) == 1, old
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          assert set(git('diff', '--name-only').splitlines()) == set(paths)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['git', 'rm', '--', workflow], check=True)
          assert git('write-tree') == 'b8ef8c960140ddbe9424cc7c21628297c5032f2d'
          PY
          git diff --cached --check
          python3 -m unittest discover -s scripts/release -p 'test_*.py' > "$OUT/release-tests.log" 2>&1
          python3 -O -m unittest discover -s scripts/release -p 'test_*.py' > "$OUT/release-tests-optimized.log" 2>&1
          python3 scripts/docs/check_docs.py > "$OUT/docs.log"
          git write-tree > "$OUT/verified-final-tree.txt"
          test "$(cat "$OUT/verified-final-tree.txt")" = b8ef8c960140ddbe9424cc7c21628297c5032f2d
          git restore --source=HEAD --staged --worktree -- .github/workflows/audit-terminal-preflight-prepare.yml
          test "$(git ls-remote origin refs/heads/fix/linux-terminal-evidence-preflight-20261014 | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(release): reject invalid terminal evidence before cargo metadata'
          git push origin HEAD:refs/heads/fix/linux-terminal-evidence-preflight-20261014
          git rev-parse HEAD > "$OUT/preparation-source.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: terminal-preflight-prepare-${{ github.run_id }}
          path: ${{ runner.temp }}/terminal-preflight
          retention-days: 14
          if-no-files-found: error
