name: audit-terminal-preflight-prepare
on:
  push:
    branches: [fix/linux-terminal-evidence-preflight-20261014]
    paths: [.github/workflows/audit-terminal-preflight-prepare.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'jiying2007/codex-tui' && github.ref == 'refs/heads/fix/linux-terminal-evidence-preflight-20261014'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply and verify the exact reviewed four-file patch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/terminal-preflight"
          mkdir -p "$OUT"
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess, urllib.request
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          base = '649ee949f304a5bc553220a3b7ad93af1bffc7f4'
          workflow = '.github/workflows/audit-terminal-preflight-prepare.yml'
          paths = ['docs/guides/release-qualification.md', 'docs/zh-CN/guides/release-qualification.md',
                   'scripts/release/linux_qualify.py', 'scripts/release/test_linux_qualify_terminal.py']
          assert git('rev-parse', 'HEAD') == os.environ['EXPECTED_HEAD']
          assert git('rev-parse', 'HEAD^') == base
          assert git('diff', '--name-only', base, 'HEAD') == workflow
          assert git('ls-remote', 'origin', 'refs/heads/main').split()[0] == base
          request = urllib.request.Request(
              'https://api.github.com/repos/jiying2007/codex-tui/git/blobs/182cefe478dd0922b2fbd3bc25988154c5fb3996',
              headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              blob = json.load(response)
          assert blob['sha'] == '182cefe478dd0922b2fbd3bc25988154c5fb3996'
          patch = lzma.decompress(base64.b64decode(blob['content']))
          assert len(patch) == 16451
          assert hashlib.sha256(patch).hexdigest() == '89b6b376ec7a05798545a85e45949f3f4e727e0c1363f4b8b0030dceaea1e9b9'
          subprocess.run(['git', 'apply', '--check'], input=patch, check=True)
          subprocess.run(['git', 'apply'], input=patch, check=True)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          assert set(git('diff', '--cached', '--name-only').splitlines()) == set(paths)
          subprocess.run(['git', 'rm', '--', workflow], check=True)
          assert git('write-tree') == '6dc5c89ca473f4675c69306cd3300943418dde9c'
          PY
          git diff --cached --check
          python3 -m unittest discover -s scripts/release -p 'test_*.py' > "$OUT/release-tests.log" 2>&1
          python3 -O -m unittest discover -s scripts/release -p 'test_*.py' > "$OUT/release-tests-optimized.log" 2>&1
          python3 scripts/docs/check_docs.py > "$OUT/docs.log"
          python3 scripts/architecture/check_module_ratchet.py release/v1.4-plan.json > "$OUT/ratchet.log"
          git write-tree > "$OUT/verified-final-tree.txt"
          test "$(cat "$OUT/verified-final-tree.txt")" = 6dc5c89ca473f4675c69306cd3300943418dde9c
          # Restore only the temporary hook for this push; remove it through the
          # connector before opening the clean candidate PR. No product changes.
          git restore --source=HEAD --staged --worktree -- .github/workflows/audit-terminal-preflight-prepare.yml
          test "$(git ls-remote origin refs/heads/fix/linux-terminal-evidence-preflight-20261014 | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(release): validate terminal evidence early and hash the retained snapshot'
          git push origin HEAD:refs/heads/fix/linux-terminal-evidence-preflight-20261014
          git rev-parse HEAD > "$OUT/preparation-source.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: terminal-preflight-prepare-${{ github.run_id }}
          path: ${{ runner.temp }}/terminal-preflight
          retention-days: 14
          if-no-files-found: error
