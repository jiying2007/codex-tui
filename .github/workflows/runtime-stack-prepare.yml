name: runtime-stack-prepare
on:
  push:
    branches: [fix/runtime-audit-f1-f3]
    paths: [.github/workflows/runtime-stack-prepare.yml]
permissions:
  contents: write
concurrency:
  group: runtime-stack-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EVIDENCE: /tmp/runtime-stack-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Prepare exact clean source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          cp .github/workflows/runtime-stack-prepare.yml "$RUNNER_TEMP/preparation-hook.yml"
          python3 - <<'PY'
          import hashlib, os, subprocess
          from pathlib import Path
          base='ed846b215e2138db87780089c7db906ebd5334e8'
          allowed={'.runtime-stack.patch','.github/workflows/runtime-stack-prepare.yml'}
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          if changed != allowed: raise SystemExit('unexpected base diff: '+repr(changed))
          patch=Path('.runtime-stack.patch').read_bytes()
          if hashlib.sha256(patch).hexdigest() != '9fc7be97776e11589419a2545f36cf09ab2c330406607fa6ac16c85b1075364c': raise SystemExit('patch hash mismatch')
          dest=Path(os.environ['EVIDENCE'])/'reviewed.patch'; dest.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(dest)],check=True)
          subprocess.run(['git','apply',str(dest)],check=True)
          for path in allowed: Path(path).unlink()
          PY
          cargo fmt --all -- --check
          git diff --check
          git config user.name github-actions\[bot\]
          git config user.email 41898282+github-actions\[bot\]@users.noreply.github.com
          git add -A
          git commit -m 'fix(cli): heap-own interactive future before native entry polling'
          git rev-parse HEAD > "$EVIDENCE/source-sha.txt"
          git rev-parse HEAD^{tree} > "$EVIDENCE/source-tree.txt"
          git archive --format=tar.gz HEAD > "$EVIDENCE/clean-source.tar.gz"
          git diff ed1cb67868b318ed1ee582b58f7c0f51f73f704a HEAD > "$EVIDENCE/formatted.patch"
          echo "CODEX_TUI_GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CODEX_TUI_PTY_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CODEX_TUI_PTY_EVIDENCE_DIR=$EVIDENCE/debug-pty" >> "$GITHUB_ENV"
      - name: Source and full Linux qualification
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee "$EVIDENCE/clippy.log"
          cargo test --locked --all-targets --all-features 2>&1 | tee "$EVIDENCE/tests.log"
          python3 -O -m unittest discover -s scripts/release -p 'test_*.py' 2>&1 | tee "$EVIDENCE/release-python.log"
          python3 -O -m unittest discover -s scripts/testing -p 'test_terminal_*.py' 2>&1 | tee "$EVIDENCE/terminal-python.log"
          python3 scripts/docs/check_docs.py
          python3 scripts/architecture/check_module_ratchet.py release/v1.4-plan.json
          python3 scripts/architecture/check_first_deployment.py
          python3 scripts/architecture/check_upstream_convergence.py
      - name: Optimized program regression
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked 2>&1 | tee "$EVIDENCE/build-release.log"
          cp target/release/codex-tui "$EVIDENCE/codex-tui"
          sha256sum "$EVIDENCE/codex-tui" > "$EVIDENCE/binary-sha256.txt"
          python3 -O scripts/testing/terminal_restoration.py target/release/codex-tui "$EVIDENCE/optimized-terminal" 2>&1 | tee "$EVIDENCE/optimized-terminal.log"
          python3 -O scripts/testing/app_server_transport_regression.py target/release/codex-tui "$EVIDENCE/optimized-app-server" 2>&1 | tee "$EVIDENCE/optimized-app-server.log"
          python3 -O scripts/testing/runtime_fault_regression.py target/release/codex-tui "$EVIDENCE/optimized-runtime" 2>&1 | tee "$EVIDENCE/optimized-runtime.log"
      - name: Push candidate only after local qualification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/runtime-audit-f1-f3 | cut -f1)" = "$GITHUB_SHA"
          if ! git push origin HEAD:refs/heads/fix/runtime-audit-f1-f3; then
            mkdir -p .github/workflows
            cp "$RUNNER_TEMP/preparation-hook.yml" .github/workflows/runtime-stack-prepare.yml
            git add .github/workflows/runtime-stack-prepare.yml
            git commit -m 'ci: retain temporary hook for connector-side cleanup'
            git push origin HEAD:refs/heads/fix/runtime-audit-f1-f3
          fi
          git rev-parse HEAD > "$EVIDENCE/pushed-sha.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: runtime-stack-preparation-${{ github.run_id }}
          path: /tmp/runtime-stack-evidence/
          if-no-files-found: warn
          retention-days: 30
