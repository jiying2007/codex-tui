name: audit-source
on:
  pull_request:
    paths:
      - .github/workflows/audit-source.yml
      - .audit/**
permissions:
  contents: read
jobs:
  candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/v1.4-automated-closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Materialize checksum-bound candidate and remove transport tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import hashlib,lzma,pathlib,shutil,subprocess
          parts=sorted(pathlib.Path('.audit').glob('closure.xz.part*'))
          assert len(parts)==5
          patch=lzma.decompress(b''.join(p.read_bytes() for p in parts))
          assert hashlib.sha256(patch).hexdigest()=='d82fb58f4307fe91f79612aae9d586eb1e8ad67b62a2c78078bd06d6a3b36995'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          shutil.rmtree('.audit')
          pathlib.Path('.github/workflows/audit-source.yml').unlink()
          PY
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = 77ff3bff2fc3702f6ec6d616365a161dc6874fbf
      - name: Verify integrated dependency and source candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
          python3 scripts/architecture/check_module_ratchet.py release/v1.3-plan.json
          python3 scripts/architecture/check_module_ratchet.py release/v1.4-plan.json
          python3 scripts/release/validate_v1_4_plan.py
          python3 scripts/release/validate_v1_4_completion.py
      - name: Retain read-only branch plan and verified source blobs without ref changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit-candidate"
          python3 scripts/repository/branch_hygiene.py --repo "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/audit-candidate/branch-plan.json"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          entries=[]
          changes=subprocess.check_output(['git','diff','--cached','--no-renames','--name-status','-z']).decode().split('\0')
          for i in range(0,len(changes)-1,2):
              status,name=changes[i:i+2]
              entry={'path':name,'mode':'100644','type':'blob','sha':None}
              if status!='D':
                  raw=pathlib.Path(name).read_bytes()
                  proc=subprocess.run(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs','--input','-'],input=json.dumps({'encoding':'utf-8','content':raw.decode('utf-8')}),text=True,capture_output=True)
                  if proc.returncode: raise SystemExit(proc.stderr+'\n'+proc.stdout)
                  entry['sha']=json.loads(proc.stdout)['sha']
                  assert entry['sha']==hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              entries.append(entry)
          receipt={'parent':os.environ['EXPECTED_HEAD'],'tree':'77ff3bff2fc3702f6ec6d616365a161dc6874fbf','entries':entries,'refUpdated':False,'stableReady':False,'validationAuthority':'tested-source-tree-not-a-release-receipt'}
          pathlib.Path(os.environ['RUNNER_TEMP'],'audit-candidate','candidate-blobs.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: audit-candidate
          path: ${{ runner.temp }}/audit-candidate/
          retention-days: 14
          if-no-files-found: warn
