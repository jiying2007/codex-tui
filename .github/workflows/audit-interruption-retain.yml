name: audit-interruption-retain
on:
  push:
    branches: [test/cache-interruption-20261014]
    paths: [.github/workflows/audit-interruption-retain.yml]
permissions:
  contents: read
jobs:
  retain:
    if: github.repository == 'jiying2007/codex-tui' && github.ref == 'refs/heads/test/cache-interruption-20261014'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply exact three-file test patch only
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          base='e08dbf6a6c08ade1dceba2efbc42848a685acb13'
          workflow='.github/workflows/audit-interruption-retain.yml'
          paths=['scripts/testing/watch_cache_interruption_regression.py',
                 'scripts/testing/test_terminal_cache_interruption.py','tests/terminal_restoration.rs']
          assert git('rev-parse','HEAD')==os.environ['EXPECTED_HEAD']
          assert git('rev-parse','HEAD^')==base
          assert git('diff','--name-only',base,'HEAD')==workflow
          assert git('ls-remote','origin','refs/heads/main').split()[0]==base
          request=urllib.request.Request(
              'https://api.github.com/repos/jiying2007/codex-tui/git/blobs/8891b892182b4ff8412745cb557a5f71033920ce',
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=30) as response:
              blob=json.load(response)
          assert blob['sha']=='8891b892182b4ff8412745cb557a5f71033920ce'
          patch=lzma.decompress(base64.b64decode(blob['content']))
          assert len(patch)==11528
          assert hashlib.sha256(patch).hexdigest()=='9c2847dab2d4ad6a4c5e3e45d749bf4cd5c92d6b9ce137ff6fb1c3fb6ddd2a23'
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply'],input=patch,check=True)
          subprocess.run(['cargo','fmt','--all','--','--check'],check=True)
          changed=set(git('diff','--name-only').splitlines())
          changed.update(git('ls-files','--others','--exclude-standard').splitlines())
          assert changed==set(paths),changed
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          python3 -m unittest discover -s scripts/testing -p 'test_terminal*.py'
          python3 -O -m unittest discover -s scripts/testing -p 'test_terminal*.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git ls-remote origin refs/heads/test/cache-interruption-20261014 | cut -f1)" = "$EXPECTED_HEAD"
          git commit -m 'test(app): retain cache cancellation disconnect and closed-admission regressions'
          git push origin HEAD:refs/heads/test/cache-interruption-20261014
