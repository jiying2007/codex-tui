name: lean-candidate-preparation
on:
  push:
    branches: [audit/lean-candidate-preparation-20261021]
permissions:
  contents: read
concurrency:
  group: lean-candidate-preparation
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Apply explicit source transformations to the pinned baseline
        shell: bash
        run: |
          set -euo pipefail
          cp -R .lean-patches "$RUNNER_TEMP/lean-patches"
          git checkout --detach d74020ecd69b19ed83d2342b3d99497b800e68d0
          mkdir -p "$RUNNER_TEMP/lean-results"
          for SCRIPT in "$RUNNER_TEMP"/lean-patches/0[0-8][0-9]_*.py; do
            echo "APPLY $(basename "$SCRIPT")"
            python3 "$SCRIPT"
          done
          cargo fmt --all
          python3 "$RUNNER_TEMP/lean-patches/900_finalize.py"
          git diff --check
      - name: Native regression and static analysis (read-only repository permission)
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/lean-results"
          cargo test --locked --all-targets --all-features > "$OUT/rust-tests.log" 2>&1 || { tail -n 160 "$OUT/rust-tests.log"; exit 1; }
          grep 'test result:' "$OUT/rust-tests.log"
          cargo clippy --locked --all-targets --all-features -- -D warnings > "$OUT/clippy.log" 2>&1 || { tail -n 160 "$OUT/clippy.log"; exit 1; }
          python3 -m unittest discover -s scripts/release -p 'test_*.py' > "$OUT/python-tests.log" 2>&1 || { tail -n 160 "$OUT/python-tests.log"; exit 1; }
          tail -n 5 "$OUT/python-tests.log"
          python3 scripts/docs/check_docs.py
          python3 scripts/architecture/check_module_ratchet.py release/v1.4-plan.json
          python3 scripts/architecture/check_upstream_convergence.py
          python3 scripts/architecture/check_first_deployment.py
          python3 scripts/release/validate_v1_4_plan.py
          python3 scripts/release/validate_v1_4_completion.py
      - name: Export candidate data, never update a branch
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/lean-patches/910_export.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: lean-candidate-data
          path: ${{ runner.temp }}/lean-results/
          if-no-files-found: warn
          retention-days: 14
  store-data:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: lean-candidate-data
          path: candidate
      - name: Store validated data objects only (no checkout, source execution, commit, or ref update)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path, PurePosixPath
          baseline = 'd74020ecd69b19ed83d2342b3d99497b800e68d0'
          tree = 'a73172af52b900437dbc45052b2ba48d9163130c'
          data = json.loads(Path('candidate/tree-data.json').read_text())
          assert data['baseSha'] == baseline and data['baseTree'] == tree
          assert 0 < len(data['files']) <= 80
          def api(route, value):
              request = urllib.request.Request('https://api.github.com/repos/jiying2007/codex-tui/git/' + route,
                  data=json.dumps(value).encode(), method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          entries = []
          seen = set()
          for entry in data['files']:
              path = entry['path']
              assert path not in seen and not path.startswith('/') and '..' not in PurePosixPath(path).parts
              assert path.startswith(('src/', 'tests/', 'docs/', 'scripts/', 'release/', '.github/workflows/')) or path in ('README.md', 'README.zh-CN.md', 'CHANGELOG.md')
              assert not path.startswith(('.lean-', '.github/workflows/lean-candidate', '.github/workflows/lean-source'))
              seen.add(path)
              content = base64.b64decode(entry['content'], validate=True)
              assert len(content) <= 1000000
              oid = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              assert oid == entry['sha'] and entry['mode'] in ('100644', '100755')
              stored = api('blobs', {'content': entry['content'], 'encoding': 'base64'})
              assert stored['sha'] == oid
              entries.append({'path': path, 'mode': entry['mode'], 'type': 'blob', 'sha': oid})
          stored = api('trees', {'base_tree': tree, 'tree': entries})
          assert stored['sha'] == data['candidateTree']
          print(json.dumps({'baseSha': baseline, 'candidateTree': stored['sha'], 'files': len(entries), 'refUpdated': False}, sort_keys=True))
          PY
