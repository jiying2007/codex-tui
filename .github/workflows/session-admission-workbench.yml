name: session-admission-workbench
on:
  push:
    branches: [fix/session-admission-status-20261012]
permissions:
  contents: write
concurrency:
  group: session-admission-workbench
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'jiying2007/codex-tui' && github.ref == 'refs/heads/fix/session-admission-status-20261012'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Apply reviewed patch to exact baseline and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          BASE=a0d688d87ec4dba93e35e1c836eefcaeb47d464a
          test "$(git rev-parse "$BASE^{tree}")" = '03cd08035c79f4351167cfd41e7d1e584fda9496'
          git diff --exit-code "$BASE" HEAD -- src tests scripts docs CHANGELOG.md release
          mkdir -p "$RUNNER_TEMP/admission-evidence"
          git apply --check .session-admission.patch
          git apply .session-admission.patch
          cargo fmt --all
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('release/v1.4-plan.json'); plan=json.loads(p.read_text())
          module='src/app_server.rs'
          plan['moduleRatchet'][module]=len(Path(module).read_text().splitlines())
          plan['ratchetReviews'].append({'date':'2026-10-12','kind':'defect-and-security-fix','scope':'Unify RPC admission and transport quarantine for truthful bootstrap/headless connectivity; skip optional probes after terminal failure and preserve the original Registry diagnostic. Retain bounded count/byte overload and intact-session negative controls through the actual binary; no new authority or budget relaxation.','modules':[module]})
          p.write_text(json.dumps(plan,indent=2)+'\n')
          PY
          rm .session-admission.patch .github/workflows/session-admission-workbench.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(rpc): report admission-quarantined sessions offline and preserve first fault'
          SHA=$(git rev-parse HEAD)
          echo "CODEX_TUI_GIT_SHA=$SHA" >> "$GITHUB_ENV"
          echo "CODEX_TUI_PTY_SOURCE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "CODEX_TUI_PTY_EVIDENCE_DIR=$RUNNER_TEMP/admission-evidence/terminal" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$RUNNER_TEMP/admission-evidence/source-sha.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/admission-evidence/source-tree.txt"
          git diff "$BASE" HEAD > "$RUNNER_TEMP/admission-evidence/reviewed.patch"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/admission-evidence/clean-source.tar.gz"
      - name: Strict complete source qualification and actual-binary fault controls
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/admission-evidence"
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee "$EVIDENCE/clippy.log"
          cargo test --locked --all-targets --all-features 2>&1 | tee "$EVIDENCE/tests.log"
          python3 scripts/docs/check_docs.py
          python3 scripts/architecture/check_module_ratchet.py release/v1.4-plan.json
          python3 scripts/architecture/check_first_deployment.py
          python3 scripts/architecture/check_upstream_convergence.py
          test -z "$(git status --porcelain)"
      - name: Publish only verified feature-branch source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/session-admission-status-20261012'
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:"$GITHUB_REF"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: session-admission-preparation-${{ github.run_id }}
          path: ${{ runner.temp }}/admission-evidence/
          if-no-files-found: error
          retention-days: 30
