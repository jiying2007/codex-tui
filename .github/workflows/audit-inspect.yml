name: audit-inspect
on:
  pull_request:
    paths:
      - .github/workflows/audit-inspect.yml
      - .audit/**
permissions:
  contents: read
jobs:
  candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/v1.4-runtime-closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Materialize checksum-bound candidate without changing refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import hashlib,lzma,pathlib,shutil,subprocess
          parts=sorted(pathlib.Path('.audit').glob('runtime.xz.part*'))
          assert len(parts)==3
          patch=lzma.decompress(b''.join(p.read_bytes() for p in parts))
          assert hashlib.sha256(patch).hexdigest()=='65981f2cd09ca4b8cf6def7471b1130d400748e7916124c9a48be804c552fecc'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          shutil.rmtree('.audit')
          pathlib.Path('.github/workflows/audit-inspect.yml').unlink()
          PY
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = edfd83993a4d4a6e32e0aa6adf1ff5b1bf674caf
      - name: Verify source contracts and regression suite
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
          python3 -O -m unittest discover -s scripts/release -p 'test_archive*.py'
          python3 scripts/architecture/check_module_ratchet.py release/v1.3-plan.json
          python3 scripts/architecture/check_module_ratchet.py release/v1.4-plan.json
          python3 scripts/release/validate_v1_4_plan.py
          python3 scripts/release/validate_v1_4_completion.py
      - name: Retain verified pathless blobs for connector publication
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          changes=subprocess.check_output(['git','diff','--cached','--no-renames','--name-status','-z']).decode().split('\0')
          entries=[]
          for i in range(0,len(changes)-1,2):
              status,name=changes[i:i+2]
              entry={'path':name,'mode':'100644','type':'blob','sha':None}
              if status!='D':
                  raw=pathlib.Path(name).read_bytes()
                  body={'encoding':'utf-8','content':raw.decode('utf-8')}
                  proc=subprocess.run(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs','--input','-'],input=json.dumps(body),text=True,capture_output=True,check=True)
                  entry['sha']=json.loads(proc.stdout)['sha']
                  assert entry['sha']==hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              entries.append(entry)
          receipt={'tree':subprocess.check_output(['git','write-tree'],text=True).strip(),'parent':os.environ['EXPECTED_HEAD'],'entries':entries,'refUpdated':False,'stableReady':False}
          directory=pathlib.Path(os.environ['RUNNER_TEMP'],'audit-candidate')
          directory.mkdir()
          (directory/'candidate-blobs.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: audit-candidate
          path: ${{ runner.temp }}/audit-candidate/
          if-no-files-found: error
          retention-days: 14
