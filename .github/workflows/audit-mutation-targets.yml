name: audit-mutation-targets
on:
  pull_request:
    paths:
      - .github/workflows/audit-mutation-targets.yml
      - .audit/mutation-targets.patch.xz
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/v1.4-mutation-targets'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Reproduce exact original behavior then materialize candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/intent-evidence"
          python3 - <<'PY'
          import hashlib,lzma,os,pathlib,subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          if git('rev-parse','HEAD') != os.environ['EXPECTED_HEAD']: raise SystemExit('head mismatch')
          if git('rev-parse','HEAD:src/app.rs') != git('rev-parse','e46badac9678b4df73eeba272a647a34b51d03af:src/app.rs'): raise SystemExit('baseline app drift')
          patch=lzma.decompress(pathlib.Path('.audit/mutation-targets.patch.xz').read_bytes())
          if hashlib.sha256(patch).hexdigest()!='aef408d0a6d83d3641fa977f116b6ff481b819abe382f54cb23e323c20b3c9ab': raise SystemExit('patch digest mismatch')
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--include=tests/mutation_editor_identity.rs','-'],input=patch,check=True)
          result=subprocess.run(['cargo','test','--locked','--test','mutation_editor_identity'],capture_output=True,text=True)
          log=result.stdout+result.stderr
          pathlib.Path(os.environ['RUNNER_TEMP'],'intent-evidence','before.log').write_text(log)
          print(log)
          if result.returncode==0 or '5 passed; 19 failed;' not in log or 'running 24 tests' not in log: raise SystemExit('expected 19 behavior failures and 5 controls')
          subprocess.run(['git','apply','--exclude=tests/mutation_editor_identity.rs','-'],input=patch,check=True)
          pathlib.Path('.audit/mutation-targets.patch.xz').unlink()
          pathlib.Path('.github/workflows/audit-mutation-targets.yml').unlink()
          git('add','-A')
          if git('write-tree')!='073d62f935547d78e876db9d7e9f67c527435c91': raise SystemExit('unexpected candidate tree')
          PY
      - name: Full candidate regression and unchanged governance
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/intent-evidence/clippy.log"
          cargo test --locked --all-targets --all-features 2>&1 | tee "$RUNNER_TEMP/intent-evidence/after.log"
          python3 -m unittest discover -s scripts/release -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/intent-evidence/python.log"
          python3 scripts/architecture/check_module_ratchet.py release/v1.3-plan.json
          python3 scripts/architecture/check_module_ratchet.py release/v1.4-plan.json
          python3 scripts/release/validate_v1_4_plan.py
          python3 scripts/release/validate_v1_4_completion.py
          git diff --cached --check
      - name: Export hash-verified Git objects without changing refs
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          tree=git('write-tree')
          if tree!='073d62f935547d78e876db9d7e9f67c527435c91': raise SystemExit('post-test tree drift')
          parts=subprocess.check_output(['git','diff','--cached','--no-renames','--name-status','-z']).decode().split('\0')
          entries=[]
          for i in range(0,len(parts)-1,2):
              status,path=parts[i:i+2]
              entry={'path':path,'mode':'100644','type':'blob','sha':None}
              if status!='D':
                  payload={'encoding':'utf-8','content':pathlib.Path(path).read_text()}
                  response=subprocess.run(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs','--input','-'],input=json.dumps(payload),text=True,capture_output=True,check=True)
                  entry['sha']=json.loads(response.stdout)['sha']
                  if entry['sha']!=git('hash-object',path): raise SystemExit('blob mismatch: '+path)
              entries.append(entry)
          receipt={'parent':os.environ['EXPECTED_HEAD'],'baseline':'e46badac9678b4df73eeba272a647a34b51d03af','tree':tree,'entries':entries,'refUpdated':False,'publicationAllowed':False}
          pathlib.Path(os.environ['RUNNER_TEMP'],'intent-evidence','candidate.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-intent-evidence
          path: ${{ runner.temp }}/intent-evidence/
          retention-days: 30
          if-no-files-found: error
