name: audit-review-consistency
on:
  pull_request:
    paths:
      - .github/workflows/audit-review-consistency.yml
      - tests/review_consistency.rs
permissions:
  contents: read
jobs:
  verify-candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/v1.4-review-consistency'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Reproduce old reducer failures before applying the fix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-evidence"
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          result = subprocess.run(['cargo','test','--locked','--test','review_consistency','--','--test-threads=1'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          pathlib.Path(os.environ['RUNNER_TEMP'],'review-evidence','before.log').write_text(result.stdout)
          print(result.stdout)
          failures = set(re.findall(r'^test (\w+) \.\.\. FAILED$', result.stdout, re.M))
          expected = {'background_review_cannot_retarget_active_file','reordered_active_review_preserves_file_identity','old_cwd_review_cannot_replace_current_snapshot','removed_thread_review_is_not_reintroduced','removed_file_resets_scroll_and_clamps_selection','empty_review_resets_scroll'}
          if result.returncode == 0 or failures != expected or '2 passed; 6 failed' not in result.stdout:
              raise SystemExit('expected six behavioral failures, not compilation or infrastructure failure')
          PY
      - name: Apply narrowly scoped reducer and fixture correction
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, textwrap
          path = pathlib.Path('src/app.rs')
          text = path.read_text()
          start = text.index('        Action::GitReviewLoaded(review) => {')
          end = text.index('        Action::PlanningSnapshotLoaded(snapshot) => {', start)
          expected = '\n'.join([
              '        Action::GitReviewLoaded(review) => {',
              '            let thread_id = review.thread_id.clone();',
              '            let key = thread_id.0.clone();',
              '            let len = review.changes.len();',
              '            state.git_reviews.insert(key, review);',
              '            state.touch_git_review_cache(&thread_id);',
              '            state.review_selected = if len == 0 {',
              '                0',
              '            } else {',
              '                state.review_selected.min(len - 1)',
              '            };',
              '        }',
              '',
          ])
          if text[start:end] != expected:
              raise SystemExit('review reducer source changed; refusing fuzzy patch')
          text = text[:start] + '        Action::GitReviewLoaded(review) => state.install_git_review(review),\n' + text[end:]
          start = text.index('    fn git_review_cache_never_evicts_current_review_on_background_load() {')
          end = text.index('    #[test]', start)
          test = text[start:end]
          marker = '        let ids = app\n'
          if test.count(marker) != 1:
              raise SystemExit('cache fixture changed')
          setup = '\n'.join([
              '        // Cached and incoming snapshots belong to the live thread cwd.',
              '        for (index, thread) in app.threads.iter_mut().enumerate() {',
              '            thread.metadata.cwd = if index == GIT_REVIEW_CACHE_LIMIT {',
              '                "/repo/new"',
              '            } else {',
              '                "/repo"',
              '            }',
              '            .into();',
              '        }',
              '',
          ])
          text = text[:start] + test.replace(marker, setup + marker, 1) + text[end:]
          path.write_text(text)
          path = pathlib.Path('src/app/review.rs')
          text = path.read_text()
          marker = 'impl AppState {\n'
          if text.count(marker) != 1:
              raise SystemExit('review implementation changed')
          method = '''    pub(super) fn install_git_review(&mut self, review: crate::git::GitReview) {
              // A completed background read is only valid for a still-live thread
              // at the same cwd. Rejected results must not touch the cache or cursor.
              if self.thread_by_id(&review.thread_id).is_none_or(|thread| {
                  thread.metadata.cwd != review.cwd
              }) {
                  return;
              }
              let thread_id = review.thread_id.clone();
              let key = thread_id.0.clone();
              if matches!(&self.view, View::Review(current) if *current == thread_id) {
                  let selected_path = self.git_reviews.get(&key)
                      .filter(|old| old.cwd == review.cwd)
                      .and_then(|old| old.changes.get(self.review_selected))
                      .map(|change| change.path.as_str());
                  let preserved = selected_path.and_then(|path| {
                      review.changes.iter().position(|change| change.path == path)
                  });
                  if preserved.is_none() {
                      self.review_scroll = 0;
                  }
                  self.review_selected = preserved.unwrap_or_else(|| {
                      self.review_selected.min(review.changes.len().saturating_sub(1))
                  });
              }
              self.git_reviews.insert(key, review);
              self.touch_git_review_cache(&thread_id);
          }

          '''
          path.write_text(text.replace(marker, marker + textwrap.dedent(method), 1))
          path = pathlib.Path('docs/implementation/v1.4-review-consistency.md')
          text = path.read_text()
          path.write_text(text + '\nThe first candidate verification (`37264750708`) reproduced all six defects but\nthen rejected an old cache test whose incoming cwd did not match its empty thread\nmetadata. The fixture now assigns its actual cached/incoming cwd to each thread;\nall cache assertions remain. The failed run is retained, not counted as a pass.\n')
          PY
          cargo fmt --all
          git diff --check
      - name: Verify complete candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/review-evidence/clippy.log"
          cargo test --locked --all-targets --all-features 2>&1 | tee "$RUNNER_TEMP/review-evidence/after.log"
          python3 -m unittest discover -s scripts/release -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/review-evidence/python.log"
          python3 scripts/architecture/check_module_ratchet.py release/v1.3-plan.json
          python3 scripts/architecture/check_module_ratchet.py release/v1.4-plan.json
          python3 scripts/release/validate_v1_4_plan.py
          python3 scripts/release/validate_v1_4_completion.py
      - name: Export verified Git blobs without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          if git('rev-parse', 'HEAD') != os.environ['EXPECTED_HEAD']:
              raise SystemExit('unexpected checkout')
          allowed = {'src/app.rs','src/app/review.rs','tests/review_consistency.rs','docs/implementation/v1.4-review-consistency.md'}
          paths = git('diff','--name-only').splitlines()
          if not set(paths).issubset(allowed) or not {'src/app.rs','src/app/review.rs'}.issubset(paths):
              raise SystemExit('unexpected formatter/source change')
          entries = []
          for name in paths:
              body = {'encoding':'utf-8','content':pathlib.Path(name).read_text()}
              result = subprocess.run(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs','--input','-'], input=json.dumps(body), text=True, capture_output=True, check=True)
              sha = json.loads(result.stdout)['sha']
              if sha != git('hash-object', name):
                  raise SystemExit('blob identity mismatch')
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          pathlib.Path('.github/workflows/audit-review-consistency.yml').unlink()
          git('add','-A')
          receipt = {'parent':os.environ['EXPECTED_HEAD'],'tree':git('write-tree'),'entries':entries,'temporaryWorkflowRemoved':True,'refUpdated':False,'localExecution':False}
          pathlib.Path(os.environ['RUNNER_TEMP'],'review-evidence','candidate.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('VERIFIED_CANDIDATE='+json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: review-consistency-evidence
          path: ${{ runner.temp }}/review-evidence/
          if-no-files-found: error
          retention-days: 30
