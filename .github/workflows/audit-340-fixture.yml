name: audit-340-fixture

on:
  push:
    branches: [fix/forge-confirmed-readback-20261013]
    paths: [.github/workflows/audit-340-fixture.yml]

permissions:
  contents: read

jobs:
  repair:
    if: github.repository == 'jiying2007/codex-tui' && github.ref == 'refs/heads/fix/forge-confirmed-readback-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Keep framing fixture peers alive until the response is actually consumed
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit-340-fixture"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          base = 'd405f4b299a968146ffbade3e75362b40df227d2'
          workflow = '.github/workflows/audit-340-fixture.yml'
          path = 'src/app_server_transport/tests.rs'
          assert git('rev-parse', 'HEAD') == os.environ['EXPECTED_HEAD']
          assert git('rev-parse', 'HEAD^') == base
          assert git('diff', '--name-only', base, 'HEAD') == workflow
          assert git('rev-parse', 'HEAD:' + path) == '0bf31e1b8d28a10ba135e38b75f3ff3104210347'
          source = Path(path).read_text(encoding='utf-8')
          for name in ('websocket_transport_round_trips_json_rpc_frames',
                       'unix_socket_transport_uses_websocket_framing'):
              start = source.index('async fn ' + name + '() {')
              end = source.index('\n#[', start)
              part = source[start:end]
              changes = [
                  ('    let server = tokio::spawn(async move {',
                   '    let (read_tx, read_rx) = tokio::sync::oneshot::channel::<()>();\n    let server = tokio::spawn(async move {'),
                  ('            .expect("send response");\n    });',
                   '            .expect("send response");\n        // This is a framing test, not an abrupt-peer-close test. Keep the\n        // stream alive until the client has consumed and asserted the response.\n        tokio::time::timeout(Duration::from_secs(5), read_rx)\n            .await\n            .expect("client response-consumed deadline")\n            .expect("client must acknowledge the response before peer shutdown");\n    });'),
                  ('    let response = transport\n        .read_json()\n        .await\n        .expect("read response")',
                   '    let response = tokio::time::timeout(Duration::from_secs(5), transport.read_json())\n        .await\n        .expect("response deadline")\n        .expect("read response")'),
                  ('    server.await.expect("fixture server");',
                   '    read_tx.send(()).expect("fixture peer must remain alive");\n    server.await.expect("fixture server");'),
              ]
              for old, new in changes:
                  assert part.count(old) == 1, (name, old)
                  part = part.replace(old, new, 1)
              source = source[:start] + part + source[end:]
          Path(path).write_text(source, encoding='utf-8')
          subprocess.run(['cargo', 'fmt', '--all'], check=True)
          ledger_path = Path('release/v1.4-plan.json')
          ledger = json.loads(ledger_path.read_text(encoding='utf-8'))
          ledger['moduleRatchet'][path] = len(Path(path).read_text(encoding='utf-8').splitlines())
          ledger_path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          assert set(git('diff', '--name-only').splitlines()) == {path, str(ledger_path)}
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', path, str(ledger_path)], check=True)
          PY
          cargo fmt --all -- --check
          python3 scripts/architecture/check_module_ratchet.py release/v1.4-plan.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git ls-remote origin refs/heads/fix/forge-confirmed-readback-20261013 | cut -f1)" = "$EXPECTED_HEAD"
          git commit -m 'test(transport): synchronize successful framing peers with response consumption'
          git push origin HEAD:refs/heads/fix/forge-confirmed-readback-20261013
          echo "CODEX_TUI_GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git update-ref refs/heads/audit-fixture HEAD
          git bundle create "$RUNNER_TEMP/audit-340-fixture/source.bundle" refs/heads/audit-fixture
      - name: Run bounded repeated framing tests without retries or production changes
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/audit-340-fixture"
          cargo test --locked --all-features --lib --no-run --message-format=json > "$OUT/build.jsonl" 2> "$OUT/build.log"
          python3 - <<'PY'
          import concurrent.futures
          import hashlib
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          out = Path(os.environ['RUNNER_TEMP']) / 'audit-340-fixture'
          messages = [json.loads(line) for line in (out / 'build.jsonl').read_text().splitlines()]
          executables = [Path(m['executable']) for m in messages if m.get('executable') and m.get('profile', {}).get('test')]
          assert len(executables) == 1, executables
          exe = executables[0]
          names = ['app_server_transport::tests::websocket_transport_round_trips_json_rpc_frames',
                   'app_server_transport::tests::unix_socket_transport_uses_websocket_framing']
          def run(item):
              name, iteration = item
              result = subprocess.run([str(exe), '--exact', name, '--nocapture'],
                                      capture_output=True, text=True, timeout=20)
              log = result.stdout + result.stderr
              if result.returncode or '1 passed; 0 failed;' not in log:
                  (out / ('failure-' + name.split('::')[-1] + '-' + str(iteration) + '.log')).write_text(log)
                  raise RuntimeError((name, iteration, result.returncode))
              return {'test': name, 'iteration': iteration, 'exitCode': result.returncode}
          started = time.monotonic()
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              results = list(pool.map(run, [(name, i) for name in names for i in range(100)]))
          receipt = {'sourceSha': os.environ['CODEX_TUI_GIT_SHA'],
                     'testBinarySha256': hashlib.sha256(exe.read_bytes()).hexdigest(),
                     'elapsedSeconds': time.monotonic() - started,
                     'concurrency': 4, 'retries': 0, 'results': results,
                     'productionTransportChanged': False,
                     'stableReady': False, 'publicationAllowed': False}
          (out / 'stress-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print('PASS 200 exact framing executions, concurrency=4, retries=0')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: audit-340-fixture-${{ github.run_id }}
          path: ${{ runner.temp }}/audit-340-fixture
          retention-days: 14
          if-no-files-found: error
