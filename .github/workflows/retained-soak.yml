name: retained-soak

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/release/validate_diagnostics.py"
      - ".github/workflows/retained-soak.yml"
  workflow_dispatch:
    inputs:
      rows:
        description: Registry rows
        required: false
        default: "50000"
      cycles:
        description: Minimum churn cycles
        required: false
        default: "256"
      duration_seconds:
        description: Minimum sustained same-process duration (1..3600 seconds)
        required: false
        default: "300"
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CODEX_TUI_GIT_SHA: ${{ github.sha }}
      ROWS: ${{ inputs.rows || '50000' }}
      CYCLES: ${{ inputs.cycles || '256' }}
      DURATION_SECONDS: ${{ inputs.duration_seconds || '300' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build exact source
        run: cargo build --locked --release
      - name: Run sustained same-process structural soak
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/codex-tui soak --rows "$ROWS" --cycles "$CYCLES" \
            --duration-seconds "$DURATION_SECONDS" --json | tee soak-evidence.json
      - name: Validate sustained resource receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/validate_diagnostics.py soak soak-evidence.json \
            --commit "$GITHUB_SHA" --rows "$ROWS" --minimum-cycles "$CYCLES" \
            --minimum-duration "$DURATION_SECONDS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: soak-evidence-${{ github.sha }}
          path: soak-evidence.json
          if-no-files-found: error
          retention-days: 30
