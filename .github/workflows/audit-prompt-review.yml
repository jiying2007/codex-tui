name: audit-prompt-review
on:
  pull_request:
    paths:
      - .github/workflows/audit-prompt-review.yml
      - audit-candidate.zlib
permissions:
  contents: read
jobs:
  candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/v1.4-prompt-review-closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      BASE: 3085bb1b6d74e1cc37b8f4b593896da65937b2f9
      CANDIDATE_TREE: 017d5a8eb61e4cdeb0bbe9ed87d7638f12b7b9ec
      PATCH_SHA256: 9d0b505dcfe1882885c6da6dde1a8a7cdceddf94343508669a123f186547f6fb
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Materialize exact candidate without changing refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import hashlib,os,pathlib,zlib
          raw=zlib.decompress(pathlib.Path('audit-candidate.zlib').read_bytes())
          if len(raw)!=45939 or hashlib.sha256(raw).hexdigest()!=os.environ['PATCH_SHA256']:
              raise SystemExit('candidate checksum mismatch')
          pathlib.Path(os.environ['RUNNER_TEMP'],'candidate.patch').write_bytes(raw)
          PY
          git read-tree --reset -u "$BASE"
          git apply --index "$RUNNER_TEMP/candidate.patch"
          test "$(git write-tree)" = "$CANDIDATE_TREE"
      - name: Verify actual candidate contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
          python3 -O -m unittest discover -s scripts/release -p 'test_archive*.py'
          python3 scripts/architecture/check_module_ratchet.py release/v1.3-plan.json
          python3 scripts/architecture/check_module_ratchet.py release/v1.4-plan.json
          python3 scripts/release/validate_v1_4_plan.py
          python3 scripts/release/validate_v1_4_completion.py
          git diff --exit-code
          test "$(git write-tree)" = "$CANDIDATE_TREE"
      - name: Retain verified pathless blobs for connector publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess
          def git(*args):
              return subprocess.check_output(['git',*args]).decode().strip()
          repo=os.environ['GITHUB_REPOSITORY']
          if repo!='jiying2007/codex-tui' or git('write-tree')!=os.environ['CANDIDATE_TREE']:
              raise SystemExit('repository/tree mismatch')
          paths=git('diff','--cached','--name-only',os.environ['BASE']).splitlines()
          if len(paths)!=14:
              raise SystemExit('unexpected candidate file count')
          elements=[]
          for path in paths:
              mode,kind,sha=git('ls-files','--stage','--',path).split()[:3]
              if mode!='100644' or kind=='':
                  raise SystemExit('unexpected file mode')
              # ls-files columns are mode, object SHA, stage, path.
              sha=kind
              content=subprocess.check_output(['git','cat-file','blob',sha])
              payload=json.dumps({'content':base64.b64encode(content).decode(),'encoding':'base64'}).encode()
              result=json.loads(subprocess.check_output(['gh','api','--method','POST',f'repos/{repo}/git/blobs','--input','-'],input=payload))
              if result['sha']!=sha:
                  raise SystemExit('blob identity mismatch')
              elements.append({'path':path,'mode':mode,'type':'blob','sha':sha})
          receipt={'repository':repo,'baseline':os.environ['BASE'],'transportHead':os.environ['EXPECTED_HEAD'],'candidateTree':os.environ['CANDIDATE_TREE'],'patchSha256':os.environ['PATCH_SHA256'],'elements':elements,'authority':'candidate tree verification only; final-head native checks required'}
          out=pathlib.Path(os.environ['RUNNER_TEMP'],'audit-candidate')
          out.mkdir()
          (out/'tree-elements.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: audit-candidate
          path: ${{ runner.temp }}/audit-candidate/
          if-no-files-found: error
          retention-days: 14
