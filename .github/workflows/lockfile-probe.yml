name: lockfile-probe

on:
  push:
    branches: [feat/m7d3-release]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate canonical Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          echo "CODEX_TUI_LOCKFILE_BEGIN"
          base64 -w 0 Cargo.lock
          echo
          echo "CODEX_TUI_LOCKFILE_END"
          sha256sum Cargo.lock
