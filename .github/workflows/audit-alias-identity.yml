name: audit-alias-identity
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-alias-identity.yml'
      - '.github/audit-alias-identity.py'
      - 'tests/alias_identity.rs'
permissions:
  contents: write
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/v1.4-alias-identity'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Reproduce alias retargeting and verify the narrow correction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/alias-audit"
          python3 - <<'PY'
          import os,pathlib,re,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'],'alias-audit')
          p=subprocess.run(['cargo','test','--locked','--test','alias_identity','--','--test-threads=1'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
          (out/'before.log').write_text(p.stdout); print(p.stdout[-6000:])
          expected={'removed_alias_target_never_retargets_the_replacement_row','refreshed_filter_cannot_redirect_an_existing_alias_editor'}
          failures=set(re.findall(r'^test (\w+) \.\.\. FAILED$',p.stdout,re.M))
          if p.returncode==0 or failures!=expected or '1 passed; 2 failed' not in p.stdout: raise SystemExit('expected two alias identity behavioral failures')
          PY
          python3 .github/audit-alias-identity.py
          cargo fmt --all
          cargo clippy --locked --all-targets --all-features -- -D warnings > "$RUNNER_TEMP/alias-audit/clippy.log" 2>&1
          cargo test --locked --all-targets --all-features > "$RUNNER_TEMP/alias-audit/after.log" 2>&1
          python3 -m unittest discover -s scripts/release -p 'test_*.py' > "$RUNNER_TEMP/alias-audit/python.log" 2>&1
          python3 scripts/architecture/check_module_ratchet.py release/v1.3-plan.json
          python3 scripts/architecture/check_module_ratchet.py release/v1.4-plan.json
          python3 scripts/release/validate_v1_4_plan.py
          python3 scripts/release/validate_v1_4_completion.py
          git diff --check
      - name: Export tested source without moving refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'],'alias-audit')
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          if git('rev-parse','HEAD')!=os.environ['EXPECTED_HEAD']: raise SystemExit('head changed')
          paths=git('diff','--name-only').splitlines()
          if not set(paths).issubset({'src/app.rs','tests/alias_identity.rs'}) or 'src/app.rs' not in paths: raise SystemExit('unexpected scope')
          entries=[]
          for name in paths:
              body={'encoding':'utf-8','content':pathlib.Path(name).read_text()}
              p=subprocess.run(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs','--input','-'],input=json.dumps(body),capture_output=True,text=True,check=True)
              sha=json.loads(p.stdout)['sha']
              if sha!=git('hash-object',name): raise SystemExit('blob mismatch')
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          pathlib.Path('.github/workflows/audit-alias-identity.yml').unlink()
          pathlib.Path('.github/audit-alias-identity.py').unlink()
          git('add','-A')
          receipt={'parent':os.environ['EXPECTED_HEAD'],'tree':git('write-tree'),'entries':entries,'refUpdated':False,'localExecution':False}
          (out/'candidate.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('VERIFIED_CANDIDATE='+json.dumps(receipt))
          print('TEST_SUMMARY\n'+'\n'.join(x for x in (out/'after.log').read_text().splitlines() if 'test result:' in x))
          PY
      - name: Surface failure context
        if: failure()
        shell: bash
        run: |
          for file in "$RUNNER_TEMP/alias-audit/"*.log; do echo "--- $file"; tail -70 "$file"; done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alias-identity-audit
          path: ${{ runner.temp }}/alias-audit/
          if-no-files-found: error
          retention-days: 30
