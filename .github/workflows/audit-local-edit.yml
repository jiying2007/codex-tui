name: audit-local-edit
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  source:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/v1.4-local-edit-durability'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact tracked source for offline verification
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git bundle create "$RUNNER_TEMP/local-edit-source.bundle" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/local-edit-source.sha"
      - uses: actions/upload-artifact@v7
        with:
          name: local-edit-source
          path: |
            ${{ runner.temp }}/local-edit-source.bundle
            ${{ runner.temp }}/local-edit-source.sha
          if-no-files-found: error
          retention-days: 7
