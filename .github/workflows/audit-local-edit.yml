name: audit-local-edit
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/v1.4-local-edit-durability'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify exact baseline and canonical patch bytes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code f7ad98c092214977f2c2512a448940a4f3445ec1 -- src tests Cargo.toml Cargo.lock release
          mkdir -p "$RUNNER_TEMP/local-edit-evidence"
          python3 - <<'PY'
          import hashlib,os,pathlib
          parts=sorted(pathlib.Path('.audit').glob('verified.patch.part*'))
          assert len(parts)==4
          raw=b''.join(p.read_bytes() for p in parts)
          patch=b''.join(line for line in raw.splitlines(keepends=True) if not line.startswith(b'index '))
          assert hashlib.sha256(patch).hexdigest()=='f09cc32695153780de4d92827f05d768d9e451da256dd1115da21f196678ba10'
          pathlib.Path(os.environ['RUNNER_TEMP'],'local-edit-evidence','validated.patch').write_bytes(patch)
          # Normalize only an accidental separator indent, never source lines.
          raw=pathlib.Path('.audit/ticket-api.patch').read_bytes().replace(b'\n diff --git ',b'\ndiff --git ')
          assert hashlib.sha256(raw).hexdigest()=='b2c997b6f34731d47b7aa97e8ebcaea7b9e6dd6c17529e4235de96e277ec7899'
          pathlib.Path(os.environ['RUNNER_TEMP'],'local-edit-evidence','ticket-api.patch').write_bytes(raw)
          PY
      - name: Reproduce original behavior with production reducer tests
        run: |
          set -euo pipefail
          git apply --include=tests/local_edit_durability.rs "$RUNNER_TEMP/local-edit-evidence/validated.patch"
          set +e
          cargo test --locked --test local_edit_durability -- --nocapture > "$RUNNER_TEMP/local-edit-evidence/before.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/local-edit-evidence/before.log"
          test "$code" = 101
          grep -q '3 passed; 8 failed' "$RUNNER_TEMP/local-edit-evidence/before.log"
      - name: Apply locally verified correction and remove temporary sources
        run: |
          set -euo pipefail
          git apply --exclude=tests/local_edit_durability.rs "$RUNNER_TEMP/local-edit-evidence/validated.patch"
          git apply "$RUNNER_TEMP/local-edit-evidence/ticket-api.patch"
          rm -r .audit
          rm .github/workflows/audit-local-edit.yml
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = 013efb021b1a437aa42e6bb9f4d7309cd9ccd63b
      - name: Verify corrected code without repository write permission
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/local-edit-evidence/clippy.log"
          cargo test --locked --all-targets --all-features 2>&1 | tee "$RUNNER_TEMP/local-edit-evidence/after.log"
          python3 -m unittest discover -s scripts/release -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/local-edit-evidence/python.log"
          python3 scripts/architecture/check_module_ratchet.py release/v1.3-plan.json
          python3 scripts/architecture/check_module_ratchet.py release/v1.4-plan.json
          python3 scripts/release/validate_v1_4_plan.py
          python3 scripts/release/validate_v1_4_completion.py
          test "$(git write-tree)" = 013efb021b1a437aa42e6bb9f4d7309cd9ccd63b
      - name: Export tested source as data for separate object creation
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'],'verified-source')
          paths=subprocess.check_output(['git','diff','--cached','--name-only','f7ad98c092214977f2c2512a448940a4f3445ec1'],text=True).splitlines()
          assert len(paths)==10 and all(not p.startswith(('.audit/','.github/')) for p in paths)
          entries=[]
          for name in paths:
              src=pathlib.Path(name)
              assert src.is_file() and not src.is_symlink()
              raw=src.read_bytes();dest=root/'files'/name;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(raw)
              entries.append({'path':name,'sha256':hashlib.sha256(raw).hexdigest(),'gitBlob':hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()})
          receipt={'head':os.environ['EXPECTED_HEAD'],'tree':'013efb021b1a437aa42e6bb9f4d7309cd9ccd63b','baseline':'f7ad98c092214977f2c2512a448940a4f3445ec1','entries':entries}
          (root/'manifest.json').write_text(json.dumps(receipt,indent=2)+'\n')
          pathlib.Path(os.environ['RUNNER_TEMP'],'local-edit-evidence','manifest.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: local-edit-verified-source
          path: ${{ runner.temp }}/verified-source/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: local-edit-evidence
          path: ${{ runner.temp }}/local-edit-evidence/
          if-no-files-found: error
          retention-days: 30
  objects:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: local-edit-verified-source
          path: source-data
      - name: Store verified source bytes as pathless Git blobs only
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='jiying2007/codex-tui'
          root=pathlib.Path('source-data')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['head']==os.environ['EXPECTED_HEAD'] and manifest['tree']=='013efb021b1a437aa42e6bb9f4d7309cd9ccd63b'
          allowed={'docs/implementation/v1.4-local-edit-durability.md','release/v1.4-plan.json','src/app.rs','src/app/local_edit.rs','src/main.rs','src/runtime_local_edit.rs','src/runtime_local_edit/route_tests.rs','src/runtime_local_edit/tests.rs','src/runtime_store_worker.rs','tests/local_edit_durability.rs'}
          assert len(manifest['entries'])==len(allowed) and {e['path'] for e in manifest['entries']}==allowed
          entries=[]
          for entry in manifest['entries']:
              path=root/'files'/entry['path'];assert path.is_file() and not path.is_symlink()
              raw=path.read_bytes();assert len(raw)<1000000 and hashlib.sha256(raw).hexdigest()==entry['sha256']
              expected=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest();assert expected==entry['gitBlob']
              body=json.dumps({'encoding':'base64','content':base64.b64encode(raw).decode()}).encode()
              request=urllib.request.Request('https://api.github.com/repos/jiying2007/codex-tui/git/blobs',data=body,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response: result=json.load(response)
              assert result['sha']==expected
              entries.append({'path':entry['path'],'mode':'100644','type':'blob','sha':expected})
          receipt={'parent':manifest['head'],'baseline':manifest['baseline'],'tree':manifest['tree'],'entries':entries,'refUpdated':False,'codeExecutedWithWriteToken':False}
          pathlib.Path('candidate-blobs.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: local-edit-candidate-blobs
          path: candidate-blobs.json
          if-no-files-found: error
          retention-days: 30
