name: temporary-cargo-lockfile-reconcile

on:
  push:
    branches:
      - feat/g23-tui-workref-link-action
    paths:
      - ".github/workflows/temporary-cargo-lockfile-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Re-resolve the patched dependency graph under the declared MSRV
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          cargo check --all-targets --all-features
          git diff -- Cargo.lock
          cargo check --locked --all-targets --all-features
          cargo test --locked --all-targets --all-features --no-run
      - name: Commit only the Cargo-generated lockfile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo did not regenerate Cargo.lock; refusing an empty commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "fix(deps): regenerate lockfile for patched advisories"
          git push origin "HEAD:${GITHUB_REF_NAME}"
