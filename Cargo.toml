[package]
name = "codex-tui"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
description = "Personal-first local terminal workbench for Codex engineering"
repository = "https://github.com/jiying2007/codex-tui"
publish = false

[dependencies]
anyhow = "1"
crossterm = "0.29"
directories = "6"
portable-pty = "0.9"
ratatui = "0.30"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "1.1"
unicode-segmentation = "1"
unicode-width = "0.2"
vt100 = "0.16.2"

[dev-dependencies]
divan = "0.1"
pretty_assertions = "1"

[lints.rust]
unsafe_code = "forbid"

[[bench]]
name = "scale"
harness = false
