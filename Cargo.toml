[package]
name = "codex-tui"
version = "1.4.0"
default-run = "codex-tui"
edition = "2024"
rust-version = "1.88"
description = "Personal-first local terminal workbench for Codex engineering"
repository = "https://github.com/jiying2007/codex-tui"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
crossterm = "0.29"
directories = "6"
futures-util = "0.3"
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }
portable-pty = "0.9"
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
toml = "1.1"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2.5"
vt100 = "0.16.2"

[dev-dependencies]
divan = "0.1"
pretty_assertions = "1"

[lints.rust]
unsafe_code = "forbid"

[[bench]]
name = "scale"
harness = false
