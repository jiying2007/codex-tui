[advisories]
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "transitive bincode 1.3.3 is required by syntect 5.3.0 dump-load through two-face 0.5.2; codex-tui only deserializes two-face embedded versioned syntax/theme assets, never untrusted input; advisory is unmaintained-only with no safe upgrade; remove when upstream drops bincode 1.x" },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
